<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>포르투나의 주사위 쇼</title>
<style>
:root{--bg:#120d1c;--panel:#231a38;--line:#4e3c78;--gold:#f5c542;--gold2:#ffe08a;--text:#f1eaff;--dim:#a99cc8;--red:#ff5a6e;--blue:#5ab0ff;--purple:#b77bff;--green:#5fe0a0;--orange:#ff9a3c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse 80% 60% at 50% -10%,#452a6e 0%,#1a1229 55%,#0d0914 100%)}
body::before{content:"";position:fixed;inset:-20% 0 0 0;pointer-events:none;background:linear-gradient(105deg,transparent 30%,rgba(255,220,150,.05) 38%,transparent 46%),linear-gradient(75deg,transparent 54%,rgba(200,160,255,.05) 62%,transparent 70%);animation:beams 12s ease-in-out infinite alternate}
@keyframes beams{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
#app{position:relative;display:flex;flex-direction:column;height:100%;max-width:1360px;margin:0 auto}
#top{display:flex;align-items:center;gap:8px;padding:7px 12px;background:linear-gradient(#2b2046,#1c1530);border-bottom:2px solid var(--line);box-shadow:0 3px 14px #0009;flex-wrap:wrap;z-index:5}
#top:empty{display:none}
.logo{font-weight:900;color:var(--gold);letter-spacing:.3px;text-shadow:0 0 12px #f5c54266;white-space:nowrap;font-size:15px;margin-right:4px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#0006;border:1px solid #ffffff14;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.pill small{color:var(--dim);font-weight:600}
.bar{position:relative;height:14px;background:#000a;border-radius:7px;overflow:hidden;min-width:96px;border:1px solid #ffffff1c}
.bar>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#e8364f,#ff7a59);transition:width .35s}
.bar.xp{min-width:54px;height:8px}.bar.xp>i{background:linear-gradient(90deg,#7b5cff,#c79bff)}
.bar>span{position:relative;display:block;text-align:center;font-size:11px;line-height:13px;font-weight:800;text-shadow:0 1px 2px #000}
.sp{flex:1}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:800;color:#2a1a05;background:linear-gradient(#ffe08a,#f5b942);padding:9px 16px;border-radius:10px;box-shadow:0 3px 0 #a86f12,0 5px 12px #0007;transition:transform .08s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a86f12}
.btn.alt{color:var(--text);background:linear-gradient(#43336a,#30244e);box-shadow:0 3px 0 #1b1430,0 5px 12px #0007}
.btn.red{color:#fff;background:linear-gradient(#ff6f7f,#d93a50);box-shadow:0 3px 0 #7d1a2a,0 5px 12px #0007}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn small{font-weight:600;opacity:.8}
.btn:disabled{filter:grayscale(1) brightness(.55);cursor:not-allowed;transform:none}
.btn.on{outline:3px solid #7ff;outline-offset:2px;animation:pulse 1s infinite}
.btn.glow{animation:glow 1.2s infinite}
@keyframes pulse{50%{outline-color:transparent}}
@keyframes glow{50%{box-shadow:0 3px 0 #a86f12,0 0 22px #ffd54a}}
#screen{position:relative;flex:1;min-height:0;overflow:auto}
.card:focus-visible,.pickgrid .card:focus-visible{outline:3px solid #7ff;outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.node:focus{outline:none}.node:focus-visible circle{stroke:#7ff;stroke-width:1.6}
#fx{position:fixed;left:0;top:0;pointer-events:none;z-index:80}
/* ---------- cards ---------- */
.cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:center}
.card{--c1:#333;--c2:#222;--cb:#888;position:relative;width:148px;min-height:132px;padding:8px 8px 10px;border-radius:14px;background:linear-gradient(160deg,var(--c1),var(--c2));border:2px solid var(--cb);box-shadow:0 4px 0 #0007,0 8px 16px #0006,inset 0 1px 0 #ffffff22;display:flex;flex-direction:column;gap:6px;transition:transform .15s,filter .2s,opacity .2s,box-shadow .2s}
.t-weapon{--c1:#6a2436;--c2:#381320;--cb:#ff6b7d}
.t-shield{--c1:#23466e;--c2:#142842;--cb:#5ab0ff}
.t-spell{--c1:#472a78;--c2:#28164a;--cb:#b77bff}
.t-utility{--c1:#5a4717;--c2:#302509;--cb:#f5c542}
.c-head{display:flex;align-items:center;gap:5px;font-weight:900;font-size:13.5px;line-height:1.1}
.c-ico{font-size:18px}
.c-name{flex:1;min-width:0}
.plus{color:var(--gold);margin-left:1px}
.c-uses{font-size:11px;background:#0007;border-radius:8px;padding:1px 6px;font-weight:800;white-space:nowrap}
.c-slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.c-slots.col{flex-direction:column;align-items:center}
.srow{display:flex;gap:6px;justify-content:center}
.slot{position:relative;width:50px;height:50px;border-radius:11px;border:2px dashed #ffffff5c;background:#0005;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:12px;line-height:1.1;text-align:center;color:#fffd;transition:all .15s}
.slot .big{font-size:24px;color:#fff}
.slot.filled{border-style:solid;border-color:#fff8;background:#0003}
#pcards .slot.filled{cursor:pointer}
.slot.cd{width:auto;min-width:78px;padding:0 8px}
.cdn{font-size:19px;color:#fff;line-height:1}
.cdbar{width:100%;height:5px;border-radius:3px;background:#0008;margin-top:3px;overflow:hidden}.cdbar i{display:block;height:100%;background:var(--gold)}
.mini{display:flex;gap:2px}.mini img{width:18px;height:18px}
.dimg{width:44px;height:44px;display:block;filter:drop-shadow(0 2px 2px #0008)}
.slot .fl{position:absolute;top:-9px;right:-7px;font-size:14px}
.c-desc{font-size:12px;line-height:1.35;color:#efe6ff;text-align:center;margin-top:auto}
.dv{display:inline-block;width:12px;height:12px;border-radius:3px;background:#f7f0dc;box-shadow:inset 0 0 0 1.5px #0005;vertical-align:-1px;margin:0 1px}
.card.used{filter:grayscale(.85) brightness(.5)}
.card.can{box-shadow:0 0 0 3px var(--gold),0 0 22px #f5c542aa;transform:translateY(-4px);cursor:pointer}
.card.can .slot:not(.filled){border-color:var(--gold);background:#f5c54226}
.card.hov{transform:translateY(-7px) scale(1.05)}
.card.dim{opacity:.38}
.card.flash{animation:cflash .5s}
.card.bad{animation:cshake .35s}
.card.off::after,.card.stolen::after{content:attr(data-off);position:absolute;inset:0;border-radius:12px;background:#000b;display:flex;align-items:center;justify-content:center;font-weight:900;color:#ffe65a;font-size:15px}
.card.temp{border-style:dashed}
.card.book{box-shadow:0 0 0 2px #b77bff66,0 0 18px #b77bff55,0 4px 0 #0007}
.badge{position:absolute;top:-9px;right:-6px;background:#b77bff;color:#fff;font-size:11px;font-weight:900;padding:2px 6px;border-radius:8px;box-shadow:0 2px 6px #0008}
.badge.g{background:#2f9e6e}
.intent{font-size:13px;font-weight:900;text-align:center;color:#fff;background:#000a;border:1px solid #ff6b7d66;border-radius:8px;padding:2px 4px}
.burnt{color:var(--orange)}
.ecards .card{width:136px;min-height:116px}
.rar{position:absolute;top:-9px;left:10px;font-size:10px;color:var(--gold);background:#1b1430;border:1px solid #f5c54255;padding:0 5px;border-radius:6px;letter-spacing:-1px}
.icard{min-height:150px;padding-bottom:16px}
.icard .btn{margin-top:4px}
@keyframes cflash{0%{transform:scale(1)}30%{transform:scale(1.1);box-shadow:0 0 0 4px #fff,0 0 30px #fff}100%{transform:scale(1)}}
@keyframes cshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* ---------- combat ---------- */
#combat{display:flex;flex-direction:column;height:100%;padding:8px 10px 10px;gap:6px}
.ez{display:flex;gap:18px;align-items:center;justify-content:center;padding:8px;border-radius:18px;background:radial-gradient(ellipse at 30% 50%,#5a1f3a55,#0000 70%)}
.fighter{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:170px}
.por{font-size:70px;line-height:1.05;filter:drop-shadow(0 8px 10px #000a);animation:bob 2.6s ease-in-out infinite}
.por.small{font-size:44px;animation:none}
.por.hit{animation:hit .35s}
.por.dead{animation:die 1.1s forwards}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes hit{0%,100%{transform:translate(0)}20%{transform:translate(-8px,2px) rotate(-6deg);filter:brightness(2) drop-shadow(0 0 10px #f00)}60%{transform:translate(6px,-2px) rotate(4deg)}}
@keyframes die{to{transform:scale(.2) rotate(40deg) translateY(40px);opacity:0;filter:grayscale(1)}}
.fname{font-weight:900;font-size:16px;text-align:center}
.fname small{color:var(--dim);font-weight:700;font-size:12px}
.fighter .bar{width:170px;height:16px}.fighter .bar>span{line-height:15px;font-size:12px}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:22px;max-width:220px}
.chip{font-size:12px;font-weight:800;padding:2px 7px;border-radius:999px;background:#000a;border:1px solid #fff3;cursor:help}
.chip.blk{background:#1d4d86;border-color:#5ab0ff}
#ann{text-align:center;min-height:24px;font-weight:800;color:var(--gold2);text-shadow:0 0 10px #f5c54255;font-size:15px}
#ann.show{animation:annIn .4s}
@keyframes annIn{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.pz{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:8px 0}
.tz{display:flex;gap:10px;align-items:stretch}
.pinfo{width:200px;justify-content:center;background:#0004;border-radius:16px;padding:6px}
.traywrap{flex:1;min-width:0;height:150px;border-radius:20px;background:radial-gradient(ellipse at 50% 40%,#23704e,#0f3b29 75%);border:6px solid #6d4a26;box-shadow:inset 0 0 34px #000b,0 6px 16px #0008,0 0 0 2px #3b2712;position:relative;overflow:hidden}
.traywrap::after{content:"FORTUNA ✦ DICE SHOW";position:absolute;inset:auto 0 6px 0;text-align:center;font-size:11px;letter-spacing:4px;color:#ffffff18;font-weight:900;pointer-events:none}
#tray{width:100%;height:100%;display:block;touch-action:none}
.acts{display:flex;flex-direction:column;gap:8px;justify-content:center;width:180px}
.acts .btn{width:100%}
.hintline{font-size:12px;color:var(--dim);text-align:center}
.warn{font-size:12px;font-weight:800;color:#ffb3bd;text-align:center}
.chg{height:6px;border-radius:3px;background:#0008;overflow:hidden;margin-top:4px}.chg i{display:block;height:100%;background:linear-gradient(90deg,#2f9e6e,#8dffc9)}
/* ---------- floats ---------- */
.float{position:fixed;pointer-events:none;font-weight:900;font-size:24px;text-shadow:0 2px 0 #000,0 0 8px #000;z-index:90;animation:floatUp 1.1s ease-out forwards;white-space:nowrap}
.float.small{font-size:16px}.float.big{font-size:38px}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.shake{animation:scr .3s}
@keyframes scr{25%{transform:translate(-5px,3px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,-2px)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#1b1430f0;border:1px solid var(--gold);color:var(--gold2);padding:8px 16px;border-radius:12px;font-weight:800;box-shadow:0 6px 18px #000a;animation:annIn .3s}
/* ---------- tooltip & modal ---------- */
#tip{position:fixed;z-index:100;max-width:300px;background:#130e20f5;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.5;pointer-events:none;display:none;box-shadow:0 8px 24px #000c}
#tip .tt-h{font-weight:900;font-size:14px;margin-bottom:2px}
#tip .tt-t{color:var(--dim);font-size:11px;margin-bottom:4px}
#tip .tt-up{margin-top:6px;padding-top:6px;border-top:1px dashed #ffffff30;color:var(--gold2)}
.rr{font-size:10px;padding:1px 6px;border-radius:6px;margin-left:4px;vertical-align:1px}
.r0{background:#555}.r1{background:#4a4a5a}.r2{background:#2d5fa8}.r3{background:#a8742d}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:70;padding:14px}
#modal.show{display:flex}
.mbox{background:linear-gradient(#2a2045,#1b1430);border:2px solid var(--line);border-radius:18px;padding:18px 20px;max-width:960px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 12px 40px #000c;animation:annIn .25s}
.mbox h2{margin:0 0 10px;color:var(--gold)}
.mbox h3{margin:14px 0 8px;color:var(--gold2);font-size:15px}
.mbox p,.mbox li{line-height:1.6;color:#e6dcff;font-size:14px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
/* ---------- pages ---------- */
.page{min-height:100%;display:flex;align-items:center;justify-content:center;padding:18px}
.panel{background:linear-gradient(#2a2045ee,#1b1430ee);border:2px solid var(--line);border-radius:22px;padding:22px;max-width:1000px;width:100%;box-shadow:0 10px 40px #000a;text-align:center}
.panel h2{margin:6px 0;font-size:26px;color:var(--gold)}
.panel h3{margin:18px 0 10px;color:var(--gold2)}
.panel p{color:#e2d8ff;line-height:1.6}
.bigico{font-size:84px;line-height:1.1;filter:drop-shadow(0 8px 12px #000a)}
.gains{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.lvup{margin:10px auto;display:inline-block;padding:8px 16px;border-radius:12px;background:linear-gradient(90deg,#7b5cff55,#f5c54255);border:1px solid var(--gold);font-weight:900;color:var(--gold2);animation:glow 1.4s infinite}
.fortuna{display:flex;gap:12px;align-items:center;justify-content:center;margin:12px auto;max-width:640px;text-align:left}
.fortuna .face{font-size:46px}
.fortuna .say{background:#fff1;border:1px solid #fff3;border-radius:14px;padding:10px 14px;font-weight:700;color:var(--gold2);line-height:1.5}
/* title */
.title{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px}
#titlecv{width:min(520px,90vw);height:150px}
.title h1{margin:0;font-size:clamp(38px,7vw,74px);line-height:1.05;font-weight:900;color:#fff;text-shadow:0 0 30px #b77bff88,0 4px 0 #3a1f6a}
.title h1 span{color:var(--gold);text-shadow:0 0 26px #f5c542aa,0 4px 0 #7a4f0a}
.t-sub{color:var(--gold2);font-weight:800;letter-spacing:2px}
.t-desc{color:#d9ccff;line-height:1.7;max-width:620px}
.t-btns{display:flex;flex-direction:column;gap:10px;min-width:260px;margin-top:8px}
.best{margin-top:8px;color:var(--dim);font-size:13px}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:14px;text-align:left}
.cls{background:#0005;border:2px solid #ffffff22;border-radius:18px;padding:14px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;display:flex;flex-direction:column;gap:6px}
.cls:hover{transform:translateY(-4px);border-color:var(--cc);box-shadow:0 0 24px color-mix(in srgb,var(--cc) 40%,transparent)}
.cls .ci{font-size:50px;text-align:center}
.cls h3{margin:0;text-align:center;color:var(--cc)}
.cls .d{font-size:13px;color:#dcd0ff;line-height:1.5}
.cls .k{font-size:12.5px;background:#ffffff10;border-radius:10px;padding:8px;line-height:1.5}
.cls .its{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;font-size:22px}
.cls .its span{cursor:help}
/* map */
.mapwrap{display:flex;gap:14px;padding:12px;height:100%;min-height:0}
.mapbox{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse at 50% 0%,#3a2a5e88,#0000 70%),#0003;border:2px solid #ffffff14;border-radius:20px;padding:10px;min-height:0}
.mapbox h2{margin:0;color:var(--gold);font-size:20px}
.mapbox .sub{color:var(--dim);font-size:13px}
svg.map{flex:1;min-height:0;width:100%;max-width:640px}
svg.map line{stroke:#ffffff30;stroke-width:.7;stroke-dasharray:1.6 1.4}
svg.map line.done{stroke:var(--gold);stroke-dasharray:none;stroke-width:.9}
svg.map line.next{stroke:#ffe08acc;stroke-width:.8}
.node circle{fill:#2e2349;stroke:#6b5a9e;stroke-width:.6;transition:all .2s}
.node text{font-size:5.4px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node.avail{cursor:pointer}
.node.avail circle{stroke:var(--gold);stroke-width:1;fill:#4a3a1e;animation:npulse 1.2s infinite}
.node.avail:hover circle{fill:#6a5220}
.node.visited circle{fill:#1a1428;stroke:#4a3a6e}
.node.visited text{opacity:.45}
.node.cur circle{stroke:#fff;stroke-width:1.2;fill:#3a2f5e}
.node.cur text{opacity:1}
.node.boss circle{stroke:#ff6b7d;stroke-width:1}
@keyframes npulse{50%{stroke-width:1.8;stroke:#fff3b0}}
.side{width:330px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.box{background:#0005;border:1px solid #ffffff18;border-radius:16px;padding:12px}
.box h4{margin:0 0 8px;color:var(--gold2)}
.eqlist{display:flex;flex-direction:column;gap:5px}
.eqi{display:flex;align-items:center;gap:8px;background:#ffffff0c;border-radius:9px;padding:5px 8px;font-size:13px;cursor:help;border-left:3px solid var(--cb)}
.eqi b{font-weight:800}.eqi small{color:var(--dim);margin-left:auto;font-size:11px;text-align:right}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:12px;color:var(--dim)}
/* shop etc */
.shopgrid{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.price{font-weight:900;color:var(--gold)}
.sold{opacity:.35;pointer-events:none}
.svc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.pickgrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pickgrid .card{cursor:pointer}
.pickgrid .card:hover{transform:translateY(-4px);box-shadow:0 0 0 3px var(--gold)}
.arrow{font-size:12px;color:var(--gold2);margin-top:4px}
.wheel{position:relative;width:300px;height:300px;margin:10px auto}
.wheel .disc{position:absolute;inset:0;border-radius:50%;border:8px solid #6d4a26;box-shadow:0 0 0 3px var(--gold),0 10px 30px #000a;transition:transform 4.2s cubic-bezier(.12,.7,.12,1)}
.wheel .lbl{position:absolute;left:50%;top:50%;width:0;height:0}
.wheel .lbl span{position:absolute;left:0;top:-128px;transform:translateX(-50%);font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap;width:78px;text-align:center}
.wheel .ptr{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:30px;z-index:2;filter:drop-shadow(0 3px 3px #000)}
.wheel .hub{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:radial-gradient(#ffe08a,#b8801c);box-shadow:0 0 10px #000;display:flex;align-items:center;justify-content:center;font-size:24px}
.duel{display:flex;gap:30px;justify-content:center;align-items:center;margin:14px 0}
.duel .side2{display:flex;flex-direction:column;align-items:center;gap:6px}
.duel img{width:56px;height:56px}
.duel .tot{font-size:26px;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stats div{background:#0005;border-radius:12px;padding:10px}
.stats b{display:block;font-size:22px;color:var(--gold)}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid #ffffff18;text-align:left;white-space:nowrap}
.tbl th{color:var(--gold2);font-weight:800}
.bagcols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* ---------- responsive ---------- */
@media (max-width:900px){
  .side{display:none}
  .card{width:128px;min-height:124px}.ecards .card{width:118px}
  .slot{width:44px;height:44px}.dimg{width:38px;height:38px}
  .fighter{min-width:120px}.por{font-size:52px}
  .pinfo{width:150px}.acts{width:140px}
  .bagcols{grid-template-columns:1fr}
}

function createRun(cls,now=0){
  const c=CL[cls];
  return{v:SAVE_V,cls,hp:c.hp,maxhp:c.hp,gold:15,level:1,xp:0,floor:1,eq:c.it.map(id=>({id,u:0})),bag:[],map:genMap(),pos:null,screen:'floor',ctx:null,combat:null,lastEn:null,
    st:{kills:0,turns:0,dmg:0,maxHit:0,gold:0,items:0,start:now}};
}
function genMap(){
  const rows=[];
  for(let r=0;r<6;r++){
    const n=r===0?R(2,3):R(2,4),row=[];
    for(let i=0;i<n;i++){
      let t;
      if(r===0)t='fight';
      else if(r===5)t=rng()<.6?'apple':'forge';
      else t=wpick({fight:44,elite:r>=2?11:0,treasure:12,apple:6,shop:9,forge:6,event:12});
      row.push({t,x:(i+1)/(n+1)+(rng()-.5)*.05,l:[],v:0});
    }
    rows.push(row);
  }
  rows.push([{t:'boss',x:.5,l:[],v:0}]);
  if(!rows.slice(2,5).some(r=>r.some(n=>n.t==='shop')))pick(rows[R(2,4)]).t='shop';
  if(!rows[5].some(n=>n.t==='apple'))rows[5][0].t='apple';
  if(!rows.slice(2,5).some(r=>r.some(n=>n.t==='elite'))){const f=rows.slice(2,5).flat().filter(n=>n.t==='fight');if(f.length)pick(f).t='elite'}
  for(let r=0;r<6;r++){
    const A=rows[r],B=rows[r+1];
    A.forEach((a,i)=>{
      const j=B.length===1?0:Math.round(i*(B.length-1)/Math.max(1,A.length-1));a.l.push(j);
      if(B.length>1&&rng()<.4){const k=clamp(j+(rng()<.5?-1:1),0,B.length-1);if(!a.l.includes(k))a.l.push(k)}
    });
    B.forEach((b,j)=>{if(!A.some(a=>a.l.includes(j))){let bi=0,bd=9;A.forEach((a,i)=>{const d=Math.abs(a.x-b.x);if(d<bd){bd=d;bi=i}});A[bi].l.push(j)}});
    A.forEach(a=>a.l.sort((x,y)=>x-y));
  }
  return rows;
}
function availNodes(){
  if(!S.pos)return S.map[0].map((n,i)=>[0,i]);
  if(S.pos.r>=S.map.length-1)return[];
  return S.map[S.pos.r][S.pos.i].l.map(j=>[S.pos.r+1,j]);
}
// 갈 수 있는 노드면 방문 처리하고 노드를 돌려준다
function visitNode(r,i){
  if(!availNodes().some(([a,b])=>a===r&&b===i))return null;
  S.pos={r,i};const n=S.map[r][i];n.v=1;return n;
}
function pickEnemy(kind){
  const fl=FL[S.floor-1];
  if(kind==='boss')return fl.boss;
  if(kind==='elite')return pick(fl.el);
  const l=fl.en.filter(k=>k!==S.lastEn);return pick(l.length?l:fl.en);
}
// 방을 마친 뒤: 보스방이면 다음 층, 아니면 맵으로
function advanceNode(){
  S.ctx=null;
  const n=S.pos&&S.map[S.pos.r][S.pos.i];
  if(n&&n.t==='boss'){S.floor++;S.map=genMap();S.pos=null;S.screen='floor'}
  else S.screen='map';
}

function rollItems(n,minRar=1,epic=false){
  const f=S.floor,w={1:Math.max(25,80-f*10),2:20+f*4,3:Math.max(3,f*4-2)};
  if(minRar>=2)delete w[1];
  const pool=Object.values(IT).filter(d=>!d.mon),out=[],used=new Set();
  for(let k=0;k<n;k++){
    const rar=(epic&&k===0)?3:+wpick(w);
    let cand=pool.filter(d=>d.rar===rar&&!used.has(d.id));if(!cand.length)cand=pool.filter(d=>!used.has(d.id));
    const d=pick(cand);used.add(d.id);out.push({id:d.id,u:rng()<.06+f*.035?1:0});
  }
  return out;
}
// 장착 칸이 남으면 장착, 아니면 가방. 들어간 곳('eq'|'bag')을 돌려준다
function gainItem(it){
  S.st.items++;
  if(S.eq.length<maxEq()){S.eq.push(it);return 'eq'}
  S.bag.push(it);return 'bag';
}

function mkCard(id,u){const d=IT[id],cd=d.slots(u).find(s=>s.t==='cd');return{id,u,uses:usesMax({id,u}),placed:[],cd:cd?cd.n:0,intent:null,done:0,dn:0,off:0,stolen:0,temp:0,sp:0}}
function F(side){
  const C=S.combat;
  return side==='p'
    ?{get hp(){return S.hp},set hp(v){S.hp=v},get maxhp(){return S.maxhp},get block(){return C.pb},set block(v){C.pb=v},st:C.pst}
    :{get hp(){return C.E.hp},set hp(v){C.E.hp=v},get maxhp(){return C.E.maxhp},get block(){return C.E.block},set block(v){C.E.block=v},st:C.E.st};
}
function makeCtx(side,card){
  const C=S.combat,foe=side==='p'?'e':'p',def=IT[card.id];
  const bonus=(side==='p'&&S.cls==='mage'&&def.type==='spell')?C.chain:0;
  return{
    dmg:(n,o)=>dealDmg(side,foe,n+bonus,o||{}),
    block:n=>gainBlock(side,n),
    heal:n=>healSide(side,n+bonus),
    st:(who,k,n)=>addStatus(who==='foe'?foe:side,k,n),
    gold:n=>{
      if(side==='p'){S.gold+=n;S.st.gold+=n;emit('gold',{n})}
      else{const l=Math.min(S.gold,n);S.gold-=l;if(l)emit('gold',{n:-l})}
    },
    dice:vals=>{if(side==='p')addDice(vals)},
    myBlock:()=>F(side).block,
  };
}
// 미리보기: 효과를 적용하지 않고 기록만 한다 (적 예고·예상 피해 표시용). 난수 효과는 고정값으로 본다.
function preview(side,card,vals){
  const o={dmg:0,block:0,heal:0,st:{},gold:0,dice:0,pierce:0};
  const src=side==='p'?S.combat.pst:S.combat.E.st;
  const c={dmg:(n,x)=>{let a=n+(src.str||0);if(src.weak)a=Math.floor(a/2);o.dmg+=Math.max(0,a);if(x&&x.pierce)o.pierce=1},
    block:n=>o.block+=n,heal:n=>o.heal+=n,st:(w,k,n)=>o.st[k]=(o.st[k]||0)+n,gold:n=>o.gold+=n,dice:v=>o.dice+=v.length,myBlock:()=>F(side).block};
  const r=rng;rng=()=>.99;try{IT[card.id].act(c,vals,card.u)}finally{rng=r}
  return o;
}
function incoming(){
  const E=S.combat.E;let t=0;
  E.cards.forEach(c=>{if(!c.intent||c.done||c.stolen)return;const conds=IT[c.id].slots(c.u);
    if(conds[0].t==='cd'){if(c.cd-c.intent[0].reduce((s,d)=>s+d.v,0)<=0)t+=preview('e',c,[0]).dmg}
    else c.intent.slice(c.dn||0).forEach(g=>t+=preview('e',c,g.map(d=>d.v)).dmg)});
  return t;
}
function dealDmg(src,dst,n,o){
  const C=S.combat;if(!C||C.over)return 0;
  const A=F(src),D=F(dst);
  let a=n+(o.raw?0:(A.st.str||0));
  if(A.st.weak&&!o.raw)a=Math.floor(a/2);
  a=Math.max(0,a);
  if(!o.raw)emit('attack',{src,dst});
  if(D.st.dodge>0&&!o.raw){D.st.dodge--;emit('dodge',{side:dst});return 0}
  let hp=a;
  if(D.block>0&&!o.pierce){const b=Math.min(D.block,hp);D.block-=b;hp-=b;if(b>0)emit('blocked',{side:dst,n:b})}
  if(hp>0){
    D.hp=Math.max(0,D.hp-hp);emit('hurt',{side:dst,n:hp});
    if(src==='p'){S.st.dmg+=hp;if(hp>S.st.maxHit)S.st.maxHit=hp}
  }else if(a===0)emit('zero',{side:dst});
  if(D.st.thorns>0&&!o.raw&&D.hp>0){emit('thorns',{side:src});dealDmg(dst,src,D.st.thorns,{raw:1})}
  return hp;
}
function loseHp(side,n,cause){const D=F(side);D.hp=Math.max(0,D.hp-n);emit('lose',{side,n,cause})}
function gainBlock(side,n){if(n<=0)return;F(side).block+=n;emit('block',{side,n})}
function healSide(side,n){const D=F(side),h=Math.max(0,Math.min(n,D.maxhp-D.hp));D.hp+=h;emit('heal',{side,n:h})}
function addStatus(side,k,n){
  if(n<=0)return;
  if(side==='e'&&(k==='freeze'||k==='burn'||k==='shock'))applyEnemyDice(k,n);
  else{const st=F(side).st;st[k]=(st[k]||0)+n}
  emit('status',{side,k,n});
}
// 적에게 거는 빙결/화상/감전은 이미 예고된 주사위에 즉시 적용
function intentDice(){const o=[];S.combat.E.cards.forEach(c=>{if(c.intent&&!c.done&&!c.stolen)c.intent.forEach(g=>g.forEach(d=>o.push({c,d})))});return o}
function applyEnemyDice(k,n){
  const E=S.combat.E;
  for(let t=0;t<n;t++){
    if(k==='freeze'){const l=intentDice().filter(o=>o.d.v>1).sort((a,b)=>b.d.v-a.d.v);if(!l.length)break;const o=l[0];o.d.v=1;o.d.fr=1;revalidate(o.c)}
    else if(k==='burn'){const l=intentDice().filter(o=>!o.d.burn);if(!l.length)break;pick(l).d.burn=1}
    else{const l=E.cards.filter(c=>c.intent&&!c.done&&!c.stolen);if(!l.length)break;const c=pick(l);c.intent=null;c.off=1}
  }
}
function revalidate(card){
  const conds=IT[card.id].slots(card.u);if(conds[0].t==='cd')return;
  const before=card.intent.length;card.intent=card.intent.filter(g=>groupFits(conds,g.map(d=>d.v)));
  if(card.intent.length<before)emit('fizzle',{});
  if(!card.intent.length)card.intent=null;
}
function perms(a){return a.length<=1?[a]:a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(p=>[x,...p]))}
function groupFits(conds,vals){const same=conds.some(c=>c.t==='same');return perms(vals).some(p=>p.every((v,i)=>condOk(conds[i],v))&&(!same||p.every(v=>v===p[0])))}
function fillGroup(conds,rem){
  const res=[],used=new Set(),same=conds.some(c=>c.t==='same');
  const bt=i=>{if(i===conds.length)return true;
    for(const d of rem){if(used.has(d)||!condOk(conds[i],d.v))continue;if(same&&res.length&&res[0].v!==d.v)continue;
      used.add(d);res.push(d);if(bt(i+1))return true;used.delete(d);res.pop()}return false};
  return bt(0)?res.slice():null;
}
const RESTRICT={eq:0,same:1,min:2,rg:2,max:3,odd:3,even:3,any:5,cd:9};
// 적 AI: 주사위를 굴려, 조건이 까다로운 장비부터 예고(인텐트) 슬롯을 채운다
function planIntents(){
  const C=S.combat,E=C.E;
  E.cards.forEach(c=>{c.intent=null;c.done=0;c.dn=0;c.off=0});
  const vals=[];for(let i=0;i<E.dice;i++)vals.push(d6());
  if(E.pas==='fickle')vals[R(0,vals.length-1)]=6;
  const pool=vals.map(v=>({id:'e'+(C.nid++),v,burn:0,fr:0}));
  C.eroll=pool.map(d=>({id:d.id,v:d.v}));
  let rem=[...pool].sort((a,b)=>b.v-a.v);
  const act=E.cards.filter(c=>!c.stolen).sort((a,b)=>Math.min(...IT[a.id].slots(a.u).map(s=>RESTRICT[s.t]))-Math.min(...IT[b.id].slots(b.u).map(s=>RESTRICT[s.t])));
  for(const c of act){
    const conds=IT[c.id].slots(c.u);if(conds[0].t==='cd')continue;
    for(let u=usesMax(c);u>0;u--){const g=fillGroup(conds,rem);if(!g)break;rem=rem.filter(d=>!g.includes(d));(c.intent=c.intent||[]).push(g)}
  }
  for(const c of act){
    const conds=IT[c.id].slots(c.u);if(conds[0].t!=='cd'||!rem.length)continue;
    const g=[];let need=c.cd;rem.sort((a,b)=>a.v-b.v);
    while(rem.length&&need>0){const d=rem.pop();g.push(d);need-=d.v}
    c.intent=[g];
  }
  E.idle=rem.map(d=>d.id);
}

// =====================================================================
//  전투: 플레이어 주사위 배치
// =====================================================================
function visibleCard(ci){const C=S.combat,c=C.cards[ci];return !c.sp||C.hand.includes(ci)}
function cardActive(ci){const c=S.combat.cards[ci];return !!c&&c.uses>0&&!c.off&&visibleCard(ci)}
// 주사위 눈 v가 들어갈 슬롯 번호 (불가하면 -1). si를 주면 그 슬롯을 우선한다
function canPlace(ci,v,si){
  const c=S.combat.cards[ci];if(!cardActive(ci))return -1;
  const conds=IT[c.id].slots(c.u);if(conds[0].t==='cd')return 0;
  const pv=c.placed.filter(Boolean).map(p=>p.v),same=conds.some(x=>x.t==='same');
  const ok=i=>!c.placed[i]&&condOk(conds[i],v)&&(!same||pv.every(p=>p===v));
  if(si!=null&&si<conds.length&&ok(si))return si;
  for(let i=0;i<conds.length;i++)if(ok(i))return i;
  return -1;
}
function addDice(vals){
  const C=S.combat;
  for(const v of vals){const d={id:C.nid++,v:clamp(v,1,6)};C.dice.push(d);emit('dieAdded',{die:d})}
}
// 주사위를 장비에 넣는다. 결과: {ok, slot, die}
function putDie(ci,id,si){
  const C=S.combat;if(!C||C.over||C.phase!=='player')return{ok:false};
  const di=C.dice.findIndex(d=>d.id===id);if(di<0)return{ok:false};
  const die=C.dice[di],c=C.cards[ci],s=canPlace(ci,die.v,si);
  if(s<0)return{ok:false};
  C.dice.splice(di,1);
  if(S.cls==='thief')C.steal=Math.min(STEAL,C.steal+die.v);
  if(die.burn){loseHp('p',2,'burn');if(outcome())return{ok:true,slot:s,die}}
  const conds=IT[c.id].slots(c.u);
  if(conds[0].t==='cd'){
    c.cd-=die.v;
    if(c.cd<=0){c.cd=conds[0].n;c.uses--;fire(ci,[die.v])}else emit('tick',{side:'p',ci});
  }else{
    c.placed[s]={v:die.v,id:die.id};
    if(conds.every((_,i)=>c.placed[i])){const vals=c.placed.map(p=>p.v);c.placed=[];c.uses--;fire(ci,vals)}
  }
  return{ok:true,slot:s,die};
}
// 여러 칸 장비에 넣어 둔 주사위를 되돌린다
function takeBack(ci,si){
  const C=S.combat,c=C&&C.cards[ci],p=c&&c.placed[si];if(!p)return null;
  c.placed[si]=null;if(!c.placed.some(Boolean))c.placed=[];
  const d={id:p.id,v:p.v};C.dice.push(d);emit('dieAdded',{die:d});return d;
}
function fire(ci,vals){
  const C=S.combat,c=C.cards[ci],def=IT[c.id];
  emit('fire',{side:'p',ci,spell:def.type==='spell'});
  def.act(makeCtx('p',c),vals,c.u);
  if(S.cls==='mage'&&def.type==='spell'){C.chain++;emit('chain',{n:C.chain})}
}
function drawBook(flip){
  const C=S.combat,sp=C.cards.map((c,i)=>c.sp?i:-1).filter(i=>i>=0),k=bookSize();
  if(sp.length<=k){C.hand=sp;return}
  if(!flip){C.hand=shuffle(sp.slice()).slice(0,k);return}
  C.hand.forEach(ci=>C.cards[ci].placed.forEach((p,si)=>p&&takeBack(ci,si)));
  const rest=shuffle(sp.filter(i=>!C.hand.includes(i))),old=shuffle(C.hand.slice());
  C.hand=rest.concat(old).slice(0,k);
}
// 전투 결과 판정: 'lose' | 'win' | null
function outcome(){
  const C=S.combat;if(!C)return null;
  if(S.hp<=0)return 'lose';
  if(C.E.hp<=0)return 'win';
  return null;
}

// =====================================================================
//  전투: 턴 흐름 (UI는 단계 사이에 연출을 끼워 넣는다)
// =====================================================================
function createCombat(kind,key,opt={}){
  const d=EN[key],hp=opt.hp||d.hp;
  const E={key,n:d.n,i:d.i,hp,maxhp:hp,block:0,st:{},dice:d.d,pas:d.pas||null,enr:0,idle:[],cards:d.it.map(([id,u])=>mkCard(id,u||0))};
  const cards=S.eq.map(it=>{const c=mkCard(it.id,it.u);if(S.cls==='mage'&&IT[it.id].type==='spell')c.sp=1;return c});
  S.combat={E,cards,kind,pb:0,pst:{},dice:[],nid:1,turn:1,phase:'start',chain:0,steal:0,sk:0,hand:[],eroll:[],eStart:0,over:0,hp0:S.hp,gold0:S.gold};
  S.screen='combat';S.lastEn=key;
  return S.combat;
}
// 플레이어 턴 시작: 방어·가시 초기화, 독, 보스 분노, 장비 초기화, 적 예고, 주사위 굴림(빙결·화상·감전 반영)
function beginPlayerTurn(){
  const C=S.combat;
  C.pb=0;C.pst.thorns=0;
  if(C.pst.poison){loseHp('p',C.pst.poison,'poison');C.pst.poison--;if(outcome())return}
  const E=C.E,ed=EN[E.key];
  if(ed.enr&&!E.enr&&E.hp<=E.maxhp/2){E.enr=1;E.st.str=(E.st.str||0)+ed.enr.str;E.dice+=ed.enr.dice||0;emit('enrage',{msg:ed.enr.msg})}
  C.cards.forEach(c=>{c.placed=[];c.off=0;if(!IT[c.id].perCombat)c.uses=usesMax(c)});
  C.chain=0;C.sk=skillMax();
  if(S.cls==='mage')drawBook(false);
  planIntents();
  const dice=[];for(let i=0;i<diceCount();i++)dice.push({id:C.nid++,v:d6()});
  if(C.pst.freeze){[...dice].sort((a,b)=>b.v-a.v).slice(0,C.pst.freeze).forEach(d=>{d.v=1;d.fr=1});C.pst.freeze=0}
  if(C.pst.burn){shuffle([...dice]).slice(0,C.pst.burn).forEach(d=>d.burn=1);C.pst.burn=0}
  if(C.pst.shock){const vis=C.cards.map((c,i)=>i).filter(visibleCard);shuffle(vis).slice(0,C.pst.shock).forEach(i=>C.cards[i].off=1);C.pst.shock=0}
  C.dice=dice;C.phase='player';C.eStart=0;
  S.st.turns++;
}
function endPlayerTurn(){
  const C=S.combat;
  C.dice=[];C.cards.forEach(c=>c.placed=[]);
  if(C.pst.weak)C.pst.weak--;
  C.phase='enemy';C.eStart=0;
}
// 적 턴 시작: 적 방어·가시 초기화, 독
function enemyTurnBegin(){
  const C=S.combat,E=C.E;if(C.eStart)return;
  E.block=0;E.st.thorns=0;
  if(E.st.poison){loseHp('e',E.st.poison,'poison');E.st.poison--}
  C.eStart=1;
}
// 다음에 실행할 적 행동 {ci, gi}. 행동 단위 진행도(dn)를 저장해 새로고침 후에도 중복 실행하지 않는다
function nextEnemyAction(){
  const E=S.combat.E;
  for(let ci=0;ci<E.cards.length;ci++){
    const c=E.cards[ci];if(!c.intent||c.done||c.stolen)continue;
    if((c.dn||0)>=c.intent.length){c.done=1;continue}
    return{ci,gi:c.dn||0};
  }
  return null;
}
function enemyAct(){
  const a=nextEnemyAction();if(!a)return null;
  const c=S.combat.E.cards[a.ci],conds=IT[c.id].slots(c.u),g=c.intent[a.gi];
  c.dn=a.gi+1;if(c.dn>=c.intent.length)c.done=1;
  const burned=g.filter(d=>d.burn).length;
  if(burned){loseHp('e',burned*2,'burn');if(outcome())return a}
  if(conds[0].t==='cd'){
    c.cd-=g.reduce((s,d)=>s+d.v,0);
    if(c.cd<=0){c.cd=conds[0].n;IT[c.id].act(makeCtx('e',c),[0],c.u)}else emit('tick',{side:'e',ci:a.ci});
  }else IT[c.id].act(makeCtx('e',c),g.map(d=>d.v),c.u);
  return a;
}
function enemyTurnEnd(){
  const C=S.combat;
  if(C.E.st.weak)C.E.st.weak--;
  C.turn++;
}

// ---------- 스킬 ----------
function rerollDie(id){const C=S.combat,d=C.dice.find(x=>x.id===id);if(!d||C.sk<=0)return null;d.v=d6();d.fr=0;d.burn=0;C.sk--;return d}
function allInDie(id){const C=S.combat,d=C.dice.find(x=>x.id===id);if(!d||C.sk<=0)return null;d.v=rng()<.5?6:1;d.fr=0;d.burn=0;C.sk--;return d}
function flipPage(){
  const C=S.combat;if(C.sk<=0||C.cards.filter(c=>c.sp).length<=bookSize())return false;
  drawBook(true);C.sk--;return true;
}
// 결과: {ok:true, card} | {ok:false, reason:'charge'|'none'}
function stealCard(){
  const C=S.combat;
  if(C.steal<STEAL)return{ok:false,reason:'charge'};
  const l=C.E.cards.filter(c=>!c.stolen);
  if(l.length<2)return{ok:false,reason:'none'};
  const c=pick(l);c.stolen=1;c.intent=null;
  const nc=mkCard(c.id,c.u);nc.temp=1;C.cards.push(nc);C.steal=0;
  return{ok:true,card:nc,ci:C.cards.length-1};
}

// ---------- 전투 종료 ----------
function resolveVictory(){
  const C=S.combat,E=C.E,kind=C.kind,f=S.floor;
  const gold=Math.round((R(7,12)+f*4)*(kind==='elite'?1.8:kind==='boss'?3:1));
  const xp=kind==='boss'?3:kind==='elite'?2:1,dice0=diceCount(),lv0=S.level;
  S.gold+=gold;S.st.gold+=gold;S.st.kills++;S.xp+=xp;
  while(S.level<10&&S.xp>=LVXP[S.level+1]){S.level++;S.maxhp+=5;S.hp=Math.min(S.maxhp,S.hp+10)}
  if(kind==='boss')S.hp=Math.min(S.maxhp,S.hp+Math.round(S.maxhp*.4));
  const last=kind==='boss'&&f>=FL.length;
  S.ctx={kind,gold,xp,lvUp:S.level-lv0,dice0,enemy:{n:E.n,i:E.i},items:last?[]:rollItems(3,kind==='normal'?1:2,kind==='boss')};
  S.combat=null;S.screen=last?'victory':'reward';
  if(last)S.dead=1;
  return{last,lv0};
}
function resolveDefeat(){S.combat=null;S.screen='gameover';S.dead=1}
// 오류 복구용: 저장된 전투 상태 때문에 계속 실패할 때, 같은 적과 처음부터 다시 (체력·골드는 전투 시작 시점으로)
function restartCombat(){
  const C=S.combat;if(!C)return null;
  if(num(C.hp0))S.hp=clamp(C.hp0,1,S.maxhp);
  if(num(C.gold0))S.gold=Math.max(0,C.gold0); // 전투 중 빼앗기거나 얻은 골드도 되돌림 (gold0이 없는 옛 세이브는 그대로)
  return createCombat(C.kind,C.E.key,C.E.maxhp!==EN[C.E.key].hp?{hp:C.E.maxhp}:{});
}
// 오류 복구용: 보상 없이 전투를 건너뛴다 (보스방이면 다음 층으로)
function skipCombat(){if(!S.combat)return false;S.combat=null;advanceNode();return true}
// 오류 복구용: 상점·보물 상자·사과나무·대장간·이벤트·보상 화면을 그대로 나가 맵으로 (보스 보상이면 다음 층으로)
const ROOMS=['shop','treasure','apple','forge','event','reward'];
function leaveRoom(){if(!ROOMS.includes(S.screen))return false;advanceNode();return true}

// =====================================================================
//  장비 관리 · 강화 (ref = {it, l:'eq'|'bag', i})
// =====================================================================
function allItems(){return[...S.eq.map((it,i)=>({it,l:'eq',i})),...S.bag.map((it,i)=>({it,l:'bag',i}))]}
const upgradable=()=>allItems().filter(r=>!r.it.u);
// ref가 지금도 같은 장비를 가리키는지 (목록을 연 뒤 바뀌었을 수 있음)
const refOk=r=>!!r&&(r.l==='eq'?S.eq:S.bag)[r.i]===r.it;
function upgradeItem(r){if(!refOk(r)||r.it.u)return false;r.it.u=1;return true}
function unequip(i){if(S.eq.length<=1||!S.eq[i])return false;S.bag.push(...S.eq.splice(i,1));return true}
function equip(i){if(S.eq.length>=maxEq()||!S.bag[i])return false;S.eq.push(...S.bag.splice(i,1));return true}

// =====================================================================
//  방: 상점 · 보물 상자 · 사과나무 · 대장간 · 여신의 이벤트
//  (UI는 화면만 그리고, 가능 여부 판단과 상태 변경은 모두 여기서 한다)
// =====================================================================
const price=it=>Math.round(({1:30,2:52,3:85}[IT[it.id].rar]+S.floor*3)*(it.u?1.4:1));
const sellPrice=it=>Math.floor(price(it)*.4);
const upPrice=()=>40+S.floor*6;
const APPLE_COST=20,APPLE_HEAL=20;
function openShop(){S.ctx={stock:rollItems(4,1).map(it=>({...it,sold:0})),apples:2,upg:1};S.screen='shop'}
const canBuy=k=>{const it=S.ctx.stock[k];return !!it&&!it.sold&&S.gold>=price(it)};
// 결과: {it, where} | null
function buyItem(k){
  if(!canBuy(k))return null;
  const s=S.ctx.stock[k];S.gold-=price(s);s.sold=1;
  const it={id:s.id,u:s.u};return{it,where:gainItem(it)};
}
const canBuyApple=()=>S.ctx.apples>0&&S.gold>=APPLE_COST&&S.hp<S.maxhp;
function buyApple(){if(!canBuyApple())return false;S.gold-=APPLE_COST;S.ctx.apples--;S.hp=Math.min(S.maxhp,S.hp+APPLE_HEAL);return true}
const canBuyUpgrade=()=>S.ctx.upg>0&&S.gold>=upPrice()&&upgradable().length>0;
function buyUpgrade(r){if(!canBuyUpgrade())return false;const cost=upPrice();if(!upgradeItem(r))return false;S.gold-=cost;S.ctx.upg--;return true}
// 마지막 장착 장비는 팔 수 없다
const sellable=()=>allItems().filter(r=>r.l==='bag'||S.eq.length>1);
function sellItem(r){
  if(!refOk(r)||(r.l==='eq'&&S.eq.length<=1))return 0;
  const g=sellPrice(r.it);S.gold+=g;(r.l==='eq'?S.eq:S.bag).splice(r.i,1);return g;
}

// 보물 상자: 2층부터 12% 확률로 미믹. 결과: {mimic:true, hp} | {mimic:false}
function openTreasure(){
  if(S.floor>=2&&rng()<.12)return{mimic:true,hp:16+S.floor*9};
  S.ctx={opened:0,items:rollItems(2,S.floor>=3?2:1),gold:R(15,25)+S.floor*5};S.screen='treasure';
  return{mimic:false};
}
function treasureOpen(){S.ctx.opened=1}
function treasurePick(k){const x=S.ctx;if(!x.opened||!x.items[k])return null;const it=x.items[k];return{it,where:gainItem(it)}}
function treasureGold(){const x=S.ctx;if(!x.opened)return 0;S.gold+=x.gold;S.st.gold+=x.gold;return x.gold}

// 사과나무: 빨간 사과(최대 체력 35% 회복) 또는 황금 사과(최대 체력 +6, 체력 6 회복)
const appleHeal=()=>Math.round(S.maxhp*.35);
function eatApple(kind){
  if(kind==='gold'){S.maxhp+=6;S.hp=Math.min(S.maxhp,S.hp+6);return 6}
  const h=Math.min(appleHeal(),S.maxhp-S.hp);S.hp+=h;return h;
}
// 대장간: 무료 강화 1회 또는 휴식
const FORGE_REST=12;
function forgeUpgrade(r){if(S.ctx.done||!upgradeItem(r))return false;S.ctx.done=1;return true}
function forgeRest(){const h=Math.min(FORGE_REST,S.maxhp-S.hp);S.hp+=h;return h}

// 여신의 이벤트
const WHEEL=[
  {k:'gold',t:'🪙 +40',c:'#b8871c'},{k:'heal',t:'❤️ +25',c:'#2f9e6e'},{k:'item',t:'🎁 장비',c:'#6a3fb0'},{k:'none',t:'꽝!',c:'#444'},
  {k:'upgrade',t:'🔨 강화',c:'#2d5fa8'},{k:'hurt',t:'💔 -10',c:'#a8283f'},{k:'maxhp',t:'❤️ 최대+5',c:'#c0622a'},{k:'halve',t:'🪙 반토막',c:'#5a2030'},
];
function openEvent(){S.ctx={type:pick(['roulette','duel','deal']),done:0};S.screen='event'}
// 결과는 돌리는 순간 정해 저장한다 (연출 중 새로고침해도 다시 뽑을 수 없음)
function spinWheel(){const x=S.ctx;if(x.res==null){x.res=R(0,WHEEL.length-1);x.applied=0}return x.res}
// 결과 적용. 반환: {k, it?, where?, fallback?} | null(이미 적용됨)
function applyWheel(){
  const x=S.ctx;if(x.res==null||x.applied)return null;
  x.applied=1;const w=WHEEL[x.res],out={k:w.k};
  switch(w.k){
    case 'gold':S.gold+=40;S.st.gold+=40;break;
    case 'heal':S.hp=Math.min(S.maxhp,S.hp+25);break;
    case 'item':{const it=rollItems(1,2)[0];out.it=it;out.where=gainItem(it);break}
    case 'upgrade':if(upgradable().length)x.pendUp=1;else{S.gold+=25;out.fallback=25}break;
    case 'hurt':S.hp=Math.max(1,S.hp-10);break;
    case 'maxhp':S.maxhp+=5;S.hp+=5;break;
    case 'halve':S.gold=Math.floor(S.gold/2);break;
  }
  return out;
}
function wheelUpgrade(r){if(!S.ctx.pendUp||!upgradeItem(r))return false;S.ctx.pendUp=0;return true}
// 주사위 대결: 2개 합이 높은 쪽이 판돈을 가져간다
const DUEL_BETS=[20,50];
function duel(bet){
  const x=S.ctx;if(x.done||!DUEL_BETS.includes(bet)||S.gold<bet)return null;
  const p=[d6(),d6()],h=[d6(),d6()],win=Math.sign(p[0]+p[1]-h[0]-h[1]);
  S.gold+=win*bet;if(win>0)S.st.gold+=bet;
  x.duel={p,h,win,bet};x.done=1;return x.duel;
}
// 여신의 거래
const DEAL_HP=12,DEAL_GOLD=40;
const canDealBlood=()=>!S.ctx.done&&S.hp>DEAL_HP;
const canDealCoin=()=>!S.ctx.done&&S.gold>=DEAL_GOLD&&upgradable().length>0;
function dealBlood(){if(!canDealBlood())return null;S.hp-=DEAL_HP;const it=rollItems(1,2)[0];S.ctx.done=1;S.ctx.got=it;return{it,where:gainItem(it)}}
function dealCoin(){if(!canDealCoin())return null;S.gold-=DEAL_GOLD;const r=pick(upgradable());r.it.u=1;S.ctx.done=1;S.ctx.upId=r.it.id;return r}

// =====================================================================
//  세이브 검증 · 복구
// =====================================================================
const num=v=>typeof v==='number'&&isFinite(v);
const validItem=it=>!!(it&&IT[it.id]&&(it.u===0||it.u===1));
const SCREENS=['floor','map','combat','reward','shop','treasure','apple','forge','event'];
const CTX_OK={
  reward:x=>x&&x.enemy&&Array.isArray(x.items)&&x.items.every(validItem),
  shop:x=>x&&Array.isArray(x.stock)&&x.stock.every(validItem),
  treasure:x=>x&&Array.isArray(x.items)&&x.items.every(validItem),
  event:x=>x&&['roulette','duel','deal'].includes(x.type),
  apple:x=>!!x,forge:x=>!!x,
};
function validSave(s){
  if(!s||typeof s!=='object'||!CL[s.cls])return false;
  if(!['hp','maxhp','gold','level','xp','floor'].every(k=>num(s[k])))return false;
  if(s.floor<1||s.floor>FL.length||s.level<1||s.level>10||s.maxhp<1)return false;
  if(!Array.isArray(s.eq)||!s.eq.length||!Array.isArray(s.bag)||![...s.eq,...s.bag].every(validItem))return false;
  if(!Array.isArray(s.map)||!s.map.length||!s.map.every(r=>Array.isArray(r)&&r.length&&r.every(n=>n&&NODE[n.t]&&Array.isArray(n.l))))return false;
  if(s.pos&&!(s.map[s.pos.r]&&s.map[s.pos.r][s.pos.i]))return false;
  return SCREENS.includes(s.screen)&&!!s.st&&typeof s.st==='object';
}
function validCombat(C){
  if(!C||!C.E||!EN[C.E.key]||!num(C.E.hp)||!Array.isArray(C.E.cards)||!Array.isArray(C.cards)||!Array.isArray(C.dice)||!C.pst)return false;
  if(![...C.E.cards,...C.cards].every(c=>c&&IT[c.id]&&Array.isArray(c.placed||[])))return false;
  if(!Array.isArray(C.hand)||!C.hand.every(i=>C.cards[i]))return false;
  return C.dice.every(d=>d&&[1,2,3,4,5,6].includes(d.v));
}
const MIGRATIONS={
  // v1 → v2: 여신의 거래 결과를 안내 문구(msg) 대신 장비 id(got / upId)로 저장
  1:s=>{
    const x=s.ctx;
    if(x&&x.type==='deal'&&typeof x.msg==='string'){
      const d=Object.values(IT).filter(d=>!d.mon&&x.msg.includes(d.name)).sort((a,b)=>b.name.length-a.name.length)[0];
      if(d){if(x.msg.includes('강화해'))x.upId=d.id;else x.got={id:d.id,u:x.msg.includes(d.name+'+')?1:0}}
      delete x.msg;
    }
    return s;
  },
};
// 이전 버전은 한 단계씩 최신으로 변환한다. 변환 경로가 없거나 미래 버전이면 거부.
function migrate(s){
  if(!s||typeof s!=='object'||!Number.isInteger(s.v))return null;
  while(s.v<SAVE_V){const f=MIGRATIONS[s.v];if(!f)return null;s=f(s);s.v++}
  return s.v===SAVE_V?s:null;
}
// 저장 문자열 → {s: 복구된 상태 | null, note: 사용자 안내 | null}
function parseSave(raw){
  let s;try{s=migrate(JSON.parse(raw))}catch(e){s=null}
  if(!validSave(s))return{s:null,note:'저장 데이터가 손상되었거나 호환되지 않아 불러올 수 없습니다.'};
  let note=null;
  if(s.screen==='combat'&&!validCombat(s.combat)){s.combat=null;s.screen='map';note='전투 데이터가 손상되어 맵에서 이어갑니다.'}
  else if(CTX_OK[s.screen]&&!CTX_OK[s.screen](s.ctx)){s.ctx=null;s.screen='map';note='방 데이터가 손상되어 맵에서 이어갑니다.'}
  if(s.screen!=='combat')s.combat=null;
  // 보스방 직후 복구된 경우: 맵에 갈 곳이 없으므로 다음 층으로
  if(s.screen==='map'&&s.pos&&s.pos.r>=s.map.length-1){s.floor=Math.min(FL.length,s.floor+1);s.map=genMap();s.pos=null;s.screen='floor'}
  return{s,note};
}
</script>
<script>
'use strict';
/* =====================================================================
   포르투나의 주사위 쇼 — 화면 · 입력 · 연출
   외부 에셋 없음 · Canvas 주사위 · Web Audio 합성음 · LocalStorage 저장
   게임 규칙은 위의 엔진 블록에 있고, 여기서는 엔진 이벤트를 받아 그리고 들려준다.
   ===================================================================== */

// ---------- 유틸 ----------
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const KEY='fortuna-dice-save-v1',BESTKEY='fortuna-dice-best-v1',SETKEY='fortuna-dice-settings-v1';
const SET=Object.assign({sound:true,speed:1},(()=>{try{return JSON.parse(localStorage.getItem(SETKEY))||{}}catch(e){return {}}})());
function saveSet(){try{localStorage.setItem(SETKEY,JSON.stringify(SET))}catch(e){}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms/SET.speed));

// ---------- Web Audio 합성 효과음 ----------
const SFX=(()=>{
  let ac=null,out=null,nb=null,lastClack=0;
  function ready(){
    if(!SET.sound)return false;
    if(!ac){
      try{
        ac=new (window.AudioContext||window.webkitAudioContext)();
        out=ac.createDynamicsCompressor();
        const g=ac.createGain();g.gain.value=.6;out.connect(g);g.connect(ac.destination);
      }catch(e){ac=null;return false}
    }
    if(ac.state==='suspended')ac.resume();
    return true;
  }
  function noise(){
    if(!nb){nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    const s=ac.createBufferSource();s.buffer=nb;return s;
  }
  function env(p,t,a,v,d){p.setValueAtTime(.0001,t);p.exponentialRampToValueAtTime(v,t+a);p.exponentialRampToValueAtTime(.0001,t+a+d)}
  function tone(f,type,t,d,v,f2,a=.004){
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    env(g.gain,t,a,v,d);o.connect(g);g.connect(out);o.start(t);o.stop(t+a+d+.05);
  }
  function nz(t,d,v,type,f,q,f2){
    const s=noise(),fl=ac.createBiquadFilter(),g=ac.createGain();fl.type=type;fl.frequency.setValueAtTime(f,t);
    if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=q;env(g.gain,t,.002,v,d);
    s.connect(fl);fl.connect(g);g.connect(out);s.start(t,Math.random()*.8);s.stop(t+d+.05);
  }
  const T=()=>ac.currentTime;
  return{
    unlock(){ready()},
    // 주사위 달그락
    clack(k=1){if(!ready())return;const t=T();if(t-lastClack<.035)return;lastClack=t;nz(t,.035,.4*k,'bandpass',2200+Math.random()*2200,6);tone(900+Math.random()*1400,'square',t,.02,.05*k)},
    rattle(){if(!ready())return;const t=T();for(let i=0;i<18;i++){const tt=t+Math.pow(Math.random(),1.5)*.75;nz(tt,.03,.28,'bandpass',1800+Math.random()*3200,7);tone(800+Math.random()*1600,'triangle',tt,.02,.05)}nz(t,.6,.06,'lowpass',600,1)},
    // 칼 휘두르기 (휙)
    swing(){if(!ready())return;const t=T();nz(t,.2,.55,'bandpass',4800,1.4,600);nz(t+.02,.12,.2,'highpass',6000,1)},
    hit(big){if(!ready())return;const t=T()+.06;tone(big?110:170,'sine',t,.2,.75,42);nz(t,.1,.5,'lowpass',big?900:1600,1);if(big)tone(60,'sine',t,.35,.5,30)},
    // 방패 막기 (챙-)
    clang(){if(!ready())return;const t=T();[1,2.76,5.4,8.93].forEach((m,i)=>tone(880*m,'sine',t,.55/(1+i*.6),.2/(1+i)));nz(t,.12,.4,'highpass',5000,1)},
    block(){if(!ready())return;const t=T();[1,2.4,4.1].forEach((m,i)=>tone(1250*m,'triangle',t,.35/(1+i),.13/(1+i)));nz(t,.05,.2,'highpass',6000,1)},
    heal(){if(!ready())return;const t=T();[523,659,784,1046].forEach((f,i)=>tone(f,'sine',t+i*.06,.28,.18))},
    burn(){if(!ready())return;const t=T();nz(t,.5,.45,'lowpass',400,1,2800)},
    freeze(){if(!ready())return;const t=T();for(let i=0;i<7;i++)tone(2000+Math.random()*2600,'sine',t+i*.04,.3,.06)},
    shock(){if(!ready())return;const t=T();tone(90,'sawtooth',t,.25,.25,60);nz(t,.25,.3,'bandpass',3000,3)},
    poison(){if(!ready())return;const t=T();for(let i=0;i<4;i++)tone(300+Math.random()*200,'sine',t+i*.07,.08,.2,700)},
    place(){if(!ready())return;const t=T();tone(520,'triangle',t,.07,.2,780);nz(t,.02,.2,'bandpass',3000,4)},
    select(){if(!ready())return;tone(660,'triangle',T(),.05,.12)},
    error(){if(!ready())return;const t=T();tone(150,'square',t,.12,.1);tone(110,'square',t+.09,.15,.1)},
    coin(){if(!ready())return;const t=T();tone(988,'square',t,.06,.09);tone(1319,'square',t+.07,.25,.09)},
    spell(){if(!ready())return;const t=T();for(let i=0;i<6;i++)tone(700+i*170,'sine',t+i*.035,.2,.1);nz(t,.3,.12,'highpass',4000,1)},
    steal(){if(!ready())return;const t=T();tone(400,'triangle',t,.08,.22,900);tone(900,'triangle',t+.08,.12,.22,1600);nz(t,.15,.15,'bandpass',5000,2)},
    dodge(){if(!ready())return;nz(T(),.28,.35,'bandpass',1200,2,5000)},
    tick(){if(!ready())return;const t=T();nz(t,.02,.35,'bandpass',3500,5);tone(1500,'square',t,.015,.05)},
    page(){if(!ready())return;const t=T();nz(t,.18,.3,'bandpass',2500,.8,5000)},
    fanfare(){if(!ready())return;const t=T();const seq=[[523,0,.12],[523,.13,.12],[523,.26,.12],[659,.39,.34],[587,.74,.12],[659,.87,.12],[784,1,.7]];
      seq.forEach(([f,d,l])=>{tone(f,'square',t+d,l,.08);tone(f/2,'triangle',t+d,l,.14)});[523,659,784,1046].forEach(f=>tone(f,'sawtooth',t+1,.9,.035))},
    levelup(){if(!ready())return;const t=T();[392,523,659,784,1046,1319].forEach((f,i)=>tone(f,'square',t+i*.07,.2,.07))},
    defeat(){if(!ready())return;const t=T();[392,370,349,311,262].forEach((f,i)=>{tone(f,'triangle',t+i*.28,.4,.16);tone(f/2,'sawtooth',t+i*.28,.4,.04)})},
    boss(){if(!ready())return;const t=T();for(let i=0;i<4;i++){tone(70,'sine',t+i*.22,.3,.8,40);nz(t+i*.22,.15,.3,'lowpass',300,1)}tone(220,'sawtooth',t+.9,.9,.08,110)},
    open(){if(!ready())return;const t=T();tone(180,'sawtooth',t,.25,.06,260);[784,988,1175,1568].forEach((f,i)=>tone(f,'sine',t+.25+i*.07,.35,.12))},
    buy(){if(!ready())return;const t=T();[1319,1568,2093].forEach((f,i)=>tone(f,'square',t+i*.06,.12,.07))},
  };
})();

// ---------- 여신의 멘트 ----------
const LINES={
  start:['자, 다음 도전자의 상대는… {e}!','관객 여러분 박수! {e}의 등장이에요!','주사위는 던져졌어요. 즐겁게 해 주세요~','오늘의 운세는 어떨까요? {e}와 한판!'],
  elite:['특별 게스트! 강력한 {e}가 무대에 올랐어요!','이번 상대는 좀 매워요. {e}!'],
  boss:['오늘 밤의 메인 이벤트! {e}!!','조명 집중! 이 층의 주인, {e}!','여기서 떨어지면… 쇼는 끝이에요. {e} 등장!'],
  six:['6! 여신이 미소 짓습니다 ✨','오오~ 행운이 쏟아지네요!','관객석이 들썩여요! 6이 나왔어요!'],
  ones:['1이라니… 관객석에서 야유가 들려요.','후훗, 오늘은 운이 없나 봐요?','주사위가 삐졌나 봐요~'],
  big:['엄청난 한 방! 관객이 열광합니다!','와우! 오늘의 하이라이트 장면이에요!','이런 걸 보려고 쇼를 하는 거죠!'],
  low:['위험해요! 벌써 쇼를 끝낼 건가요?','관객들이 숨을 죽이고 있어요…'],
  win:['브라보! 다음 무대로!','훌륭해요, 도전자! 박수~','여신의 총애가 당신에게!'],
};
// 멘트·팁 같은 연출용 무작위는 엔진 난수(rng)를 쓰지 않는다 → 같은 시드면 게임 진행이 같다
const uiPick=a=>a[Math.floor(Math.random()*a.length)];
const line=(k,e)=>uiPick(LINES[k]).replace('{e}',e||'');

// =====================================================================
//  UI 상태 · 저장소 (LocalStorage 실시간 동기화)
// =====================================================================
let VIEW='title';    // 런이 없을 때의 화면 (title | cls)
const UI={busy:false,sel:null,mode:null,hideIntents:false,drag:null,flashQ:[]};
let saveWarned=false,loadNote=null;
function storageOK(){try{localStorage.setItem('__fortuna_probe','1');localStorage.removeItem('__fortuna_probe');return true}catch(e){return false}}
function save(){
  if(!S||S.dead)return;
  try{localStorage.setItem(KEY,JSON.stringify(S))}
  catch(e){console.warn('저장 실패',e);if(!saveWarned){saveWarned=true;toast('⚠ 진행 상황을 저장하지 못했습니다. 사생활 보호 모드이거나 저장 공간이 부족할 수 있어요.',6000)}}
}
function loadSave(){
  loadNote=null;let raw;
  try{raw=localStorage.getItem(KEY)}catch(e){return null}
  if(!raw)return null;
  const r=parseSave(raw);loadNote=r.note;return r.s;
}
function wipeSave(){try{localStorage.removeItem(KEY)}catch(e){}}
// ---------- 플레이 기록 (보스 밸런스 측정용, 브라우저에만 저장) ----------
const LOGKEY='fortuna-dice-log-v1';
function getLog(){try{const l=JSON.parse(localStorage.getItem(LOGKEY));return Array.isArray(l)?l:[]}catch(e){return []}}
function logFight(won){
  const C=S.combat;if(!C)return;
  const l=getLog();
  l.push({t:Date.now(),cls:S.cls,lv:S.level,floor:S.floor,en:C.E.key,kind:C.kind,turns:C.turn,hp0:C.hp0??S.hp,hp1:Math.max(0,S.hp),maxhp:S.maxhp,won:won?1:0});
  try{localStorage.setItem(LOGKEY,JSON.stringify(l.slice(-400)))}catch(e){}
}
function getBest(){try{return JSON.parse(localStorage.getItem(BESTKEY))}catch(e){return null}}
function recordBest(win){
  const b=getBest()||{floor:0,wins:0};
  if(win)b.wins=(b.wins||0)+1;

const FACES=[
  {n:[0,0,1],a:[1,0,0],b:[0,1,0],v:1},{n:[0,0,-1],a:[-1,0,0],b:[0,1,0],v:6},
  {n:[1,0,0],a:[0,0,-1],b:[0,1,0],v:3},{n:[-1,0,0],a:[0,0,1],b:[0,1,0],v:4},
  {n:[0,1,0],a:[1,0,0],b:[0,0,-1],v:5},{n:[0,-1,0],a:[1,0,0],b:[0,0,1],v:2},

const DC={

  burst(x,y,c,n=16){for(let i=0;i<n;i++){const an=Math.random()*Math.PI*2,sp=80+Math.random()*260;this.pt.push({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-90,l:.5+Math.random()*.45,c,s:2+Math.random()*4})}},

function toast(t,ms=2400){const b=$('#toast'),d=document.createElement('div');d.textContent=t;b.appendChild(d);setTimeout(()=>d.remove(),ms)}

const POR=s=>s==='e'?'#e-por':'#p-por';
function fmtFx(o){const p=[];if(o.dmg)p.push('⚔️'+o.dmg+(o.pierce?'↯':''));if(o.block)p.push('🛡'+o.block);if(o.heal)p.push('💚'+o.heal);for(const k in o.st)p.push(ST[k].i+o.st[k]);if(o.gold)p.push('🪙'+o.gold);return p.join(' ')||'—'}
function burstAt(sel,color,n){const el=$(sel);if(el){const c=center(el);FX.burst(c.x,c.y,color,n)}}
const STATUS_SFX={burn:'burn',freeze:'freeze',shock:'shock',poison:'poison',weak:'poison',str:'levelup',thorns:'block',dodge:'dodge'};
onEvent((type,p)=>{
  switch(type){
    case 'attack':SFX.swing();break;
    case 'dodge':floatAt(POR(p.side),'회피!','#bff');SFX.dodge();break;
    case 'blocked':SFX.clang();floatAt(POR(p.side),'🛡-'+p.n,'#8cf','small');break;
    case 'hurt':
      floatAt(POR(p.side),'-'+p.n,'#ff5a6e',p.n>=15?'big':'');SFX.hit(p.n>=12);bump(POR(p.side));burstAt(POR(p.side),'#ff5a6e',Math.min(30,8+p.n));
      if(p.side==='p'&&p.n>=8)shakeScreen();
      if(p.side==='e'&&p.n>=15)announce(line('big'));
      break;
    case 'zero':floatAt(POR(p.side),'0','#ccc','small');break;
    case 'thorns':floatAt(POR(p.side),'🌵','#b5e36b','small');break;
    case 'lose':floatAt(POR(p.side),(p.cause==='burn'?'🔥':'🧪')+'-'+p.n,'#ff9a6e');bump(POR(p.side));break;
    case 'block':SFX.block();floatAt(POR(p.side),'🛡+'+p.n,'#7fc3ff');break;
    case 'heal':SFX.heal();floatAt(POR(p.side),'+'+p.n,'#5fe0a0');burstAt(POR(p.side),'#5fe0a0',10);break;
    case 'status':{const s=ST[p.k];floatAt(POR(p.side),s.i+' '+s.n+(p.n>1?' '+p.n:''),s.c,'small');SFX[STATUS_SFX[p.k]]();break}
    case 'fizzle':floatAt('#e-por','행동 무산!','#8fd8ff','small');break;
    case 'gold':SFX.coin();floatAt('#p-por',(p.n>0?'🪙+':'🪙-')+Math.abs(p.n),'#f5c542','small');break;
    case 'dieAdded':Tray.add(p.die,'p');break;
    case 'fire':UI.flashQ.push(`#pcards [data-ci="${p.ci}"]`);if(p.spell)SFX.spell();break;
    case 'tick':SFX.tick();if(p.side==='p')UI.flashQ.push(`#pcards [data-ci="${p.ci}"]`);break;
    case 'chain':if(p.n>=2)floatAt('#p-por','연계 +'+p.n,'#d9b3ff','small');break;
    case 'enrage':announce(p.msg);SFX.boss();break;
  }
});

const alive=C=>!!(S&&S.combat===C&&!C.over);
function checkEnd(){
  const C=S&&S.combat;if(!C||C.over)return true;
  const o=outcome();if(!o)return false;
  C.over=1;o==='win'?win():lose();return true;
}
function placeDie(ci,id,si,dropped){
  const C=S&&S.combat;if(!C||UI.busy||C.phase!=='player')return false;
  const die=C.dice.find(d=>d.id===id);if(!die)return false;
  const s=canPlace(ci,die.v,si);
  if(s<0){SFX.error();const el=$(`#pcards [data-ci="${ci}"]`);if(el){el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad')}return false}
  const slotEl=$(`#pcards [data-ci="${ci}"] .slot[data-s="${s}"]`),from=Tray.take(id);
  if(!dropped&&from&&slotEl)FX.fly(die.v,die.fr?'f':'p',from,center(slotEl),.2);
  UI.sel=null;SFX.place();
  putDie(ci,id,s);
  if(!checkEnd()){save();render()}
  return true;
}
function unplace(ci,si){if(takeBack(ci,si)){SFX.select();save();render()}}
function startCombat(kind,key,opt={}){beginCombatUI(createCombat(kind,key,opt))}
function beginCombatUI(C){
  const d=EN[C.E.key];save();
  UI.busy=true;render();
  if(C.kind==='boss'){SFX.boss();announce(line('boss',d.n)+(d.t?'  — “'+d.t+'”':''))}
  else announce(line(C.kind==='elite'?'elite':'start',d.n));
  setTimeout(()=>{if(alive(C))startPlayerTurn()},700/SET.speed);
}
async function startPlayerTurn(){
  const C=S&&S.combat;if(!C||C.over)return;
  UI.busy=true;UI.sel=null;UI.mode=null;
  beginPlayerTurn();if(checkEnd())return;
  save();
  // --- 연출: 적 주사위 → 예고 슬롯으로, 이어서 내 주사위 ---
  const E=C.E;
  UI.hideIntents=true;render();
  await Tray.roll(C.eroll,'e');if(!alive(C))return;
  await sleep(150);
  const flights=[];
  E.cards.forEach((c,ci)=>{if(!c.intent)return;c.intent.forEach((g,gi)=>g.forEach((d,di)=>{
    const t=Tray.get(d.id),el=$(`#ecards [data-eci="${ci}"] .srow[data-g="${gi}"] .slot[data-s="${IT[c.id].slots(c.u)[0].t==='cd'?0:di}"]`);
    if(t&&el){const from=Tray.screen(t);Tray.list=Tray.list.filter(x=>x!==t);flights.push(FX.fly(d.v,d.fr?'f':'e',from,center(el),.34))}
  }))});
  Tray.list.forEach(t=>t.st='fade');
  await Promise.all(flights);if(!alive(C))return;
  UI.hideIntents=false;render();SFX.place();
  await sleep(120);
  await Tray.roll(C.dice,'p');if(!alive(C))return;
  UI.busy=false;fatalCount=0;render();
  const sixes=C.dice.filter(d=>d.v===6).length,ones=C.dice.filter(d=>d.v===1).length;
  if(S.hp<S.maxhp*.25)announce(line('low'));
  else if(sixes>=2)announce(line('six'));
  else if(ones>=2)announce(line('ones'));
}
async function endTurn(){
  const C=S&&S.combat;if(!C||UI.busy||C.phase!=='player')return;
  UI.busy=true;UI.sel=null;UI.mode=null;
  Tray.fadeAll();endPlayerTurn();save();render();
  await sleep(300);if(!alive(C))return;
  await enemyTurn();
}
async function enemyTurn(){
  const C=S&&S.combat;if(!C||C.over)return;
  UI.busy=true;render();
  if(!C.eStart){
    enemyTurnBegin();save();render();if(checkEnd())return;
    await sleep(300);if(!alive(C))return;
  }
  let a;
  while((a=nextEnemyAction())){
    if(a.gi===0){UI.flashQ.push(`#ecards [data-eci="${a.ci}"]`);render();await sleep(260);if(!alive(C))return}
    enemyAct();
    if(checkEnd())return;
    save();render();await sleep(380);if(!alive(C))return;
  }
  enemyTurnEnd();save();render();
  await sleep(250);if(!alive(C))return;
  await startPlayerTurn();
}

// ---------- 스킬 ----------
function useSkill(){
  const C=S&&S.combat;if(!C||UI.busy||C.phase!=='player')return;
  if(S.cls==='warrior'||S.cls==='gambler'){
    if(C.sk<=0){SFX.error();return}
    UI.mode=UI.mode?null:(S.cls==='warrior'?'reroll':'allin');UI.sel=null;SFX.select();
    if(UI.mode)announce(S.cls==='warrior'?'🔁 다시 굴릴 주사위를 고르세요.':'🎰 운명을 걸 주사위를 고르세요!');
    render();return;
  }
  if(S.cls==='mage'){
    if(!flipPage()){SFX.error();return}
    SFX.page();save();render();return;
  }
  if(S.cls==='thief'){
    const r=stealCard();
    if(!r.ok){SFX.error();toast(r.reason==='charge'?`주사위 눈 합계 ${STEAL}을 사용하면 충전됩니다.`:'더 훔칠 장비가 없습니다!');return}
    SFX.steal();announce(`🫳 ${IT[r.card.id].name}${r.card.u?'+':''}을(를) 훔쳤습니다! 적의 예고 행동도 취소!`);
    UI.flashQ.push(`#pcards [data-ci="${r.ci}"]`);save();render();
  }
}
async function skillOnDie(id){
  const C=S.combat,mode=UI.mode;
  const d=mode==='allin'?allInDie(id):rerollDie(id);if(!d)return;
  UI.mode=null;UI.busy=true;save();render();
  await Tray.reroll(id,d.v);if(!alive(C))return;
  UI.busy=false;
  if(mode==='allin'){if(d.v===6){announce('🎰 잭팟! 6!');SFX.buy()}else{announce('🎰 꽝… 1이 나왔어요.');SFX.error()}}
  render();
}

// ---------- 전투 종료 ----------
function win(){
  logFight(true);
  const r=resolveVictory();
  if(r.last){recordBest(true);wipeSave()}else save();
  UI.busy=true;UI.sel=null;UI.mode=null;FX.ghost=null;
  const el=$('#e-por');if(el)el.classList.add('dead');
  announce(line('win'));SFX.fanfare();if(S.level>r.lv0)setTimeout(()=>SFX.levelup(),1500);
  Tray.fadeAll();
  const s0=S;setTimeout(()=>{if(S!==s0)return;UI.busy=false;Tray.detach();render()},1500/SET.speed);
}
function lose(){
  logFight(false);
  resolveDefeat();recordBest(false);wipeSave();
  UI.busy=true;FX.ghost=null;SFX.defeat();
  const el=$('#p-por');if(el)el.classList.add('dead');
  announce('쇼가… 끝났습니다.');
  const s0=S;setTimeout(()=>{if(S!==s0)return;UI.busy=false;Tray.detach();render()},1600/SET.speed);
}

const TitleFx={cv:null,dice:[],last:0,
  init(cv){this.cv=cv;this.dice=[6,1,5].map((v,i)=>({q:faceQ(v),ax:randAxis(),w:.7+Math.random()*.6,x:.22+i*.28}))},
  draw(now){
    const cv=this.cv;if(!cv)return;if(!cv.isConnected){this.cv=null;return}
    const r=cv.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);
    if(cv.width!==Math.round(r.width*dpr)){cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr)}
    const g=cv.getContext('2d'),dt=Math.min(.05,(now-(this.last||now))/1000);this.last=now;
    g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,r.width,r.height);
    const s=Math.min(r.height*.62,r.width*.2);
    this.dice.forEach((d,i)=>{d.q=Q.norm(Q.mul(Q.axis(d.ax,d.w*dt),d.q));const y=r.height/2+Math.sin(now/600+i*2)*8;
      g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(d.x*r.width,r.height/2+s*.5,s*.4,s*.1,0,0,Math.PI*2);g.fill();
      drawCube(g,d.x*r.width,y,s,d.q,i===1?'e':'p')});
  }};

// 턴 흐름에서 예외가 나면 UI가 '처리 중'에 멈추지 않도록, 알리고 마지막 저장 지점에서 이어가게 한다
let fatalKey='',fatalCount=0;
function onFatal(err){
  if(!err||String(err.message||err)==='Script error.')return; // 다른 출처 스크립트(확장 프로그램 등)의 오류는 무시
  console.error(err);
  // 이미 오류 안내가 떠 있으면 새로 띄우지 않는다 (시간으로 거르면 빠르게 이어진 '새' 오류를 놓쳐 조작이 멈춘 채 남음)
  UI.busy=false;UI.drag=null;UI.mode=null;UI.sel=null;FX.ghost=null;
  if($('#modal.show #fataldump'))return;
  const inRun=!!(S&&!S.dead),saved=inRun?loadSave():null;
  // 같은 방(층·위치·화면)에서 플레이어 턴까지 가지 못하고 연달아 실패하면, 저장 상태 자체가 원인일 수 있다
  const key=inRun?`${S.floor}:${S.pos?S.pos.r+','+S.pos.i:'-'}:${S.screen}`:'';
  fatalCount=key&&key===fatalKey?fatalCount+1:1;fatalKey=key;
  const again=fatalCount>=2&&!!saved;
  const stuck=again&&saved.screen==='combat'&&!!saved.combat, stuckRoom=again&&ROOMS.includes(saved.screen);
  const msg=String(err.message||err);
  const report=JSON.stringify({error:String(err.stack||msg),at:new Date().toISOString(),ua:navigator.userAgent,saveVersion:SAVE_V,repeat:fatalCount,save:saved||S||null},null,1);
  modal(`<h2>⚠ 문제가 생겼어요</h2>
    <p>${stuck?'같은 전투에서 오류가 반복되고 있어요. 전투를 처음부터 다시 하거나, 보상 없이 건너뛸 수 있어요.':stuckRoom?'이 방에서 오류가 반복되고 있어요. 방을 그대로 나가 맵으로 돌아갈 수 있어요.':saved?'진행 중에 예기치 못한 오류가 발생했습니다. 마지막으로 저장된 지점에서 다시 이어갈 수 있어요.':inRun?'진행 중에 예기치 못한 오류가 발생했습니다. 저장된 진행이 없어 타이틀로 돌아가야 해요.':'예기치 못한 오류가 발생했습니다.'}</p>
    <p style="font-size:12px;color:var(--dim)">${esc(msg).slice(0,200)}</p>
    <div id="fataldump"></div>
    <div class="row">
      ${stuck?'<button class="btn" data-a="restart">🔁 이 전투를 처음부터 다시</button><button class="btn alt" data-a="skip">⏭ 보상 없이 건너뛰고 맵으로</button>'
        :stuckRoom?'<button class="btn" data-a="leave">🚪 이 방을 나가 맵으로</button>'
        :saved?'<button class="btn" data-a="reload">💾 마지막 저장 지점에서 이어가기</button>':''}
      <button class="btn alt" data-a="report">📋 오류 정보 복사</button>
      <button class="btn alt" data-a="${inRun?'title':'close'}">${inRun?'🏠 타이틀로':'닫기'}</button>
    </div>`,
    box=>box.addEventListener('click',e=>{
      const a=e.target.closest('[data-a]');if(!a)return;
      const fresh=()=>{closeModal();$('#screen').innerHTML='';Tray.detach();UI.busy=false;UI.hideIntents=false};
      switch(a.dataset.a){
        case 'reload':{const s=loadSave();if(!s)return;fresh();S=s;resume();break}
        case 'restart':{const s=loadSave();if(!s)return;fresh();S=s;const C=restartCombat();if(C)beginCombatUI(C);else render();toast('🔁 전투를 처음부터 다시 시작합니다.');break}
        case 'skip':{const s=loadSave();if(!s)return;fresh();S=s;skipCombat();save();render();toast('⏭ 전투를 건너뛰었습니다.');break}
        case 'leave':{const s=loadSave();if(!s)return;fresh();S=s;leaveRoom();save();render();toast('🚪 방을 나와 맵으로 돌아왔습니다.');break}
        case 'report':copyText(report,'#fataldump');break;
        case 'title':closeModal();S=null;VIEW='title';Tray.detach();render();break;
      }
    }));
}
function resume(){

function intentText(c){
  const conds=IT[c.id].slots(c.u);if(!c.intent)return '';
  if(conds[0].t==='cd'){
    const sum=c.intent[0].reduce((s,x)=>s+x.v,0),rem=c.cd-sum;
    return rem>0?`⏳ ${c.cd}→${rem}`:`⏳ 발동! ${fmtFx(preview('e',c,[0]))}`;
  }
  const o={dmg:0,block:0,heal:0,st:{},gold:0,pierce:0};

function trayPt(e){const r=$('#tray').getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function bindCombat(){
  const cv=$('#tray');
  cv.addEventListener('pointerdown',e=>{
    const C=S&&S.combat;if(!C||UI.busy||C.phase!=='player')return;
    SFX.unlock();const p=trayPt(e),d=Tray.hit(p.x,p.y);
    if(!d){if(UI.sel!=null){UI.sel=null;render()}return}
    if(UI.mode){skillOnDie(d.id);return}
    UI.drag={id:d.id,x0:e.clientX,y0:e.clientY,moved:false};
    try{cv.setPointerCapture(e.pointerId)}catch(_){}
  });
  cv.addEventListener('pointermove',e=>{
    const dr=UI.drag;
    if(!dr){const p=trayPt(e);cv.style.cursor=S&&S.combat&&!UI.busy&&Tray.hit(p.x,p.y)?'grab':'default';return}
    if(!dr.moved&&Math.hypot(e.clientX-dr.x0,e.clientY-dr.y0)>6){
      const d=Tray.get(dr.id);if(!d){UI.drag=null;return}
      dr.moved=true;d.st='drag';UI.sel=dr.id;FX.ghost={v:d.v,col:d.fr?'f':'p',x:e.clientX,y:e.clientY};SFX.select();hideTip();render();
    }
    if(dr.moved&&FX.ghost){
      FX.ghost.x=e.clientX;FX.ghost.y=e.clientY;
      const el=document.elementFromPoint(e.clientX,e.clientY),card=el&&el.closest('#pcards .card[data-ci]');
      $$('#pcards .card.hov').forEach(c=>c!==card&&c.classList.remove('hov'));
      if(card&&card.classList.contains('can'))card.classList.add('hov');
    }
  });
  const up=e=>{
    const dr=UI.drag;if(!dr)return;UI.drag=null;
    if(dr.moved){
      FX.ghost=null;const d=Tray.get(dr.id);if(d)d.st='rest';
      const el=e.type==='pointerup'?document.elementFromPoint(e.clientX,e.clientY):null;
      const card=el&&el.closest('#pcards .card[data-ci]'),slot=el&&el.closest('.slot[data-s]');
      if(!(card&&placeDie(+card.dataset.ci,dr.id,slot?+slot.dataset.s:null,true))){UI.sel=null;render()}
    }else{UI.sel=UI.sel===dr.id?null:dr.id;SFX.select();render()}
  };
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  $('#pcards').addEventListener('click',e=>{
    const C=S&&S.combat;if(!C||UI.busy||C.phase!=='player')return;
    const card=e.target.closest('.card[data-ci]');if(!card)return;
    const ci=+card.dataset.ci,slot=e.target.closest('.slot[data-s]');
    if(slot&&slot.classList.contains('filled')&&UI.sel==null){unplace(ci,+slot.dataset.s);return}
    if(UI.sel!=null){placeDie(ci,UI.sel,slot?+slot.dataset.s:null);return}
    // 선택 없이 장비를 클릭하면: 들어갈 수 있는 가장 높은 주사위를 자동 투입
    const best=[...C.dice].sort((a,b)=>b.v-a.v).find(d=>canPlace(ci,d.v)>=0);
    if(best)placeDie(ci,best.id,slot?+slot.dataset.s:null);else{SFX.error();announce('이 장비에 넣을 수 있는 주사위가 없어요.')}
  });
  const db=$('#dicebtns');
  db.addEventListener('click',e=>{const b=e.target.closest('[data-did]');if(b)chooseDie(+b.dataset.did)});
  $('#acts').addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
    if(b.dataset.a==='end')endTurn();else if(b.dataset.a==='skill')useSkill();
  });
}

let modalReturn=null;
function modal(html,bind){
  const m=$('#modal');if(!m.classList.contains('show'))modalReturn=document.activeElement;
  m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true">${html}</div>`;m.classList.add('show');
  const box=m.firstChild;box.addEventListener('click',e=>{if(e.target.closest('[data-a="close"]'))closeModal()});
  if(bind)bind(box);
  const f=box.querySelector('button:not([disabled]),[data-k]');if(f)f.focus({preventScroll:true});
}
function closeModal(){const m=$('#modal');m.classList.remove('show');m.innerHTML='';hideTip();if(modalReturn&&modalReturn.isConnected)modalReturn.focus({preventScroll:true});modalReturn=null}
function confirmBox(msg,yes){

function copyText(txt,holder){
  const show=()=>{const h=$(holder);if(!h)return;h.innerHTML='<p>아래 내용을 직접 복사하세요.</p><textarea readonly style="width:100%;height:120px"></textarea>';const ta=h.querySelector('textarea');ta.value=txt;ta.select()};
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('📋 클립보드에 복사했습니다.'),show);else show();
}
function openStats(){
  const l=getLog(),pct=(a,b)=>b?Math.round(a/b*100)+'%':'-',avg=(r,f)=>r.length?r.reduce((s,x)=>s+f(x),0)/r.length:null;
  const rows=FL.map((f,i)=>{
    const r=l.filter(x=>x.en===f.boss),w=r.filter(x=>x.won).length,t=avg(r,x=>x.turns),h=avg(r,x=>(x.hp0-x.hp1)/x.maxhp);
    return`<tr><td>${i+1}층</td><td>${EN[f.boss].i} ${EN[f.boss].n}</td><td>${r.length}</td><td>${r.length?`${w} (${pct(w,r.length)})`:'-'}</td><td>${t==null?'-':t.toFixed(1)}</td><td>${h==null?'-':Math.round(h*100)+'%'}</td></tr>`}).join('');
  const recent=l.slice(-12).reverse().map(x=>`<tr><td>${new Date(x.t).toLocaleDateString()}</td><td>${CL[x.cls]?CL[x.cls].i:''} Lv${x.lv}</td><td>${x.floor}층</td><td>${EN[x.en]?EN[x.en].i+' '+EN[x.en].n:x.en}${x.kind==='boss'?' 👑':x.kind==='elite'?' ★':''}</td><td>${x.turns}턴</td><td>❤️ ${x.hp0}→${x.hp1}</td><td>${x.won?'승리':'패배'}</td></tr>`).join('');
  modal(`<h2>📊 전투 기록</h2><p>이 브라우저에만 저장되는 최근 전투 ${l.length}회의 기록입니다(외부로 전송하지 않음). 보스 난이도를 조정할 때 참고 자료로 씁니다.</p>
    <h3>보스별 통계</h3><div class="tblwrap"><table class="tbl"><tr><th>층</th><th>보스</th><th>도전</th><th>승리</th><th>평균 턴</th><th>평균 체력 손실</th></tr>${rows}</table></div>

    <div id="logdump"></div>
