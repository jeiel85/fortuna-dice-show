    <div class="shopgrid">
      <div class="card t-shield icard" style="width:230px"><div class="bigico" style="font-size:56px">🍎</div><b>빨간 사과</b><div class="c-desc">체력 ${appleHeal()} 회복 (최대 체력의 35%)</div><button class="btn" data-a="red">먹는다</button></div>
      <div class="card t-utility icard" style="width:230px"><div class="bigico" style="font-size:56px">🍏</div><b>황금 사과</b><div class="c-desc">최대 체력 +6, 체력 6 회복</div><button class="btn" data-a="gold">먹는다</button></div>
    </div></div></div>`;
  $('#screen .panel').onclick=e=>{
    const a=e.target.closest('[data-a]');if(!a)return;
    const n=eatApple(a.dataset.a);
    toast(a.dataset.a==='gold'?'🍏 최대 체력 +6':`🍎 체력 +${n}`);SFX.heal();afterNode();
  };
}

// ---------- 대장간 ----------
function renderForge(){
  const x=S.ctx,can=upgradable().length>0;
  $('#screen').innerHTML=`<div class="page"><div class="panel">
    <div class="bigico">⚒️</div><h2>드워프 대장간</h2>
    <div class="fortuna"><div class="face">🧔</div><div class="say">${x.done?'좋은 물건이 됐군! 잘 써먹으라고.':'망치질 한 번이면 충분하지! 장비 하나를 공짜로 강화해 주마. 아니면 불가에서 좀 쉬었다 가든가.'}</div></div>
    <div class="row">${x.done?'<button class="btn" data-a="leave">떠나기 ▶</button>'
      :`<button class="btn glow" data-a="up" ${can?'':'disabled'}>🔨 장비 강화 (무료)</button><button class="btn alt" data-a="rest">🔥 불가에서 휴식 (체력 +${FORGE_REST})</button>`}</div></div></div>`;
  $('#screen .panel').onclick=e=>{
    const a=e.target.closest('[data-a]');if(!a||a.disabled)return;
    if(a.dataset.a==='up')doUpgrade('🔨 강화할 장비 선택',forgeUpgrade);
    else if(a.dataset.a==='rest'){const h=forgeRest();SFX.heal();toast(`🔥 체력 +${h}`);afterNode()}
    else afterNode();
  };
}

// ---------- 여신의 이벤트 ----------
function enterEvent(){openEvent();save();render()}
function wheelFx(o){
  if(!o)return;
  if(o.it)gotToast(o);
  if(o.fallback)toast(`강화할 장비가 없어 🪙${o.fallback}로 대신!`);
  ['none','hurt','halve'].includes(o.k)?SFX.error():SFX.fanfare();
}
function renderEvent(){
  const x=S.ctx;let body='';
  if(x.type==='roulette'){
    if(x.res!=null&&!x.applied&&!x.spinning){wheelFx(applyWheel());save()}
    const rot=x.res!=null?360*6-(x.res*45+22.5):0;
    body=`<h2>🎡 여신의 룰렛</h2>
      <div class="fortuna"><div class="face">👸</div><div class="say">${x.res==null?'한 번 돌려 보시겠어요? 무엇이 나올지는… 저도 몰라요♡':x.spinning?'돌아간다~ 돌아간다~!':`결과는… <b>${WHEEL[x.res].t}</b>!`}</div></div>
      <div class="wheel"><div class="ptr">🔻</div><div class="disc" style="background:conic-gradient(${WHEEL.map((w,k)=>`${w.c} ${k*45}deg ${(k+1)*45}deg`).join(',')});transform:rotate(${x.spinning?0:rot}deg)">
        ${WHEEL.map((w,k)=>`<div class="lbl" style="transform:rotate(${k*45+22.5}deg)"><span>${w.t}</span></div>`).join('')}</div><div class="hub">⭐</div></div>
      <div class="row">${x.res==null?'<button class="btn glow" data-a="spin">룰렛 돌리기!</button><button class="btn alt" data-a="leave">지나친다</button>'
        :x.spinning?'':x.pendUp?'<button class="btn glow" data-a="up">🔨 강화할 장비 고르기</button>':'<button class="btn" data-a="leave">계속 ▶</button>'}</div>`;
  }else if(x.type==='duel'){
    const du=x.duel;
    body=`<h2>🐰 주사위 대결</h2>
      <div class="fortuna"><div class="face">🐰</div><div class="say">${du?(du.win>0?'으앙, 졌다! 판돈 가져가~':du.win<0?'헤헤, 내가 이겼다! 판돈은 내 거~':'무승부! 판돈은 돌려줄게.'):'여신님의 조수 토끼가 대결을 신청합니다! 주사위 2개의 합이 높은 쪽이 판돈을 가져가요.'}</div></div>
      ${du?`<div class="duel"><div class="side2"><b>도전자</b><div>${du.p.map(v=>`<img src="${dieURL(v,'p')}" alt="${v}">`).join('')}</div><div class="tot">${du.p[0]+du.p[1]}</div></div><div class="tot">VS</div>
        <div class="side2"><b>토끼</b><div>${du.h.map(v=>`<img src="${dieURL(v,'e')}" alt="${v}">`).join('')}</div><div class="tot">${du.h[0]+du.h[1]}</div></div></div>
        <div class="row"><button class="btn" data-a="leave">계속 ▶</button></div>`
      :`<div class="row">${DUEL_BETS.map(b=>`<button class="btn" data-bet="${b}" ${S.gold<b?'disabled':''}>🪙 ${b} 걸기</button>`).join('')}<button class="btn alt" data-a="leave">거절한다</button></div>`}`;
  }else{
    const msg=x.got?`계약 성립♡ ${IT[x.got.id].icon} ${IT[x.got.id].name}${x.got.u?'+':''}을(를) 드렸어요.`
      :x.upId?`${IT[x.upId].icon} ${IT[x.upId].name}을(를) 강화해 드렸어요. 반짝반짝~`
      :x.done?'거래는 끝났어요.':'공짜는 없는 법이죠. 무언가를 바치면, 그만한 걸 드릴게요.';
    body=`<h2>🌙 여신의 거래</h2>
      <div class="fortuna"><div class="face">👸</div><div class="say">${msg}</div></div>
      <div class="row">${x.done?'<button class="btn" data-a="leave">계속 ▶</button>'
        :`<button class="btn red" data-a="blood" ${canDealBlood()?'':'disabled'}>❤️ 체력 ${DEAL_HP}를 바치고 희귀 장비 받기</button>
          <button class="btn" data-a="coin" ${canDealCoin()?'':'disabled'}>🪙 ${DEAL_GOLD}을 바치고 무작위 장비 강화</button>
          <button class="btn alt" data-a="leave">거절한다</button>`}</div>`;
  }
  $('#screen').innerHTML=`<div class="page"><div class="panel">${body}</div></div>`;
  $('#screen .panel').onclick=e=>{
    const bet=e.target.closest('[data-bet]');
    if(bet&&!bet.disabled){
      const du=duel(+bet.dataset.bet);if(!du)return;
      SFX.rattle();setTimeout(()=>du.win>0?SFX.coin():du.win<0?SFX.error():0,500);save();render();return;
    }
    const a=e.target.closest('[data-a]');if(!a||a.disabled)return;
    switch(a.dataset.a){
      case 'spin':{
        const res=spinWheel();save();x.spinning=1;render();SFX.select();
        const disc=$('.wheel .disc');requestAnimationFrame(()=>requestAnimationFrame(()=>{disc.style.transform=`rotate(${360*6-(res*45+22.5)}deg)`}));
        let t=0;const tk=()=>{if(t>4000)return;SFX.tick();t+=40+t*.12;setTimeout(tk,40+t*.12)};tk();
        const s0=S;setTimeout(()=>{if(S!==s0||S.ctx!==x)return;delete x.spinning;wheelFx(applyWheel());save();render()},4400);
        break;
      }
      case 'up':doUpgrade('🔨 강화할 장비 선택',wheelUpgrade);break;
      case 'blood':{const r=dealBlood();if(r){gotToast(r);SFX.spell();save();render()}break}
      case 'coin':if(dealCoin()){SFX.levelup();save();render()}break;
      case 'leave':afterNode();break;
    }
  };
}

// ---------- 게임 오버 / 승리 ----------
function renderEnd(win){
  const m=Math.max(1,Math.round((Date.now()-S.st.start)/60000));
  $('#screen').innerHTML=`<div class="page"><div class="panel">
    <div class="bigico">${win?'👑':'💀'}</div><h2>${win?'쇼의 주인공은 당신!':'쇼가 끝났습니다'}</h2>
    <div class="fortuna"><div class="face">👸</div><div class="say">${win?'믿을 수 없어요… 제 무대에서 저를 이기다니! 오늘 밤의 행운은 전부 당신 거예요. 브라보!':'후훗, 오늘은 운이 없었네요. 다음 쇼에서 또 만나요, 도전자~'}</div></div>
    <div class="stats"><div><b>${S.floor}층</b>도달</div><div><b>${CL[S.cls].i} Lv${S.level}</b>${CL[S.cls].n}</div><div><b>${S.st.kills}</b>처치</div><div><b>${S.st.dmg}</b>총 피해</div><div><b>${S.st.maxHit}</b>최대 한 방</div><div><b>${S.st.turns}</b>턴</div><div><b>${S.st.gold}</b>획득 골드</div><div><b>${m}분</b>플레이 시간</div></div>
    <h3>최종 장비</h3><div class="cards">${S.eq.map(it=>itemCardHTML(it)).join('')}</div>
    <div class="row"><button class="btn glow" data-a="title">타이틀로</button></div></div></div>`;
  $('[data-a="title"]').onclick=()=>{S=null;VIEW='title';render()};
}

// ---------- 툴팁 ----------
function itemTip(id,u){
  u=+u;const d=IT[id];if(!d)return '';const um=d.uses?d.uses(u):1,um1=d.uses?d.uses(1):1;
  return`<div class="tt-h">${d.icon} ${d.name}${u?'+':''}<span class="rr r${d.rar}">${RARN[d.rar]}</span></div>
    <div class="tt-t">${TYPEN[d.type]}${d.type==='spell'&&S&&S.cls==='mage'?' · 스펠북 주문 (연계 가능)':''}</div>
    <div>🎲 조건: <b>${d.slots(u).map(condText).join(' + ')}</b></div>
    <div>✨ 효과: ${descHTML(d.desc(u))}</div>
    ${um>1?`<div>🔁 ${d.perCombat?'전투당':'턴당'} ${um}회 사용</div>`:''}
    ${!u&&!d.mon?`<div class="tt-up">⬆ 강화 시: ${d.slots(1).map(condText).join(' + ')} · ${descHTML(d.desc(1))}${um1!==um?` · ${um1}회`:''}</div>`:''}`;
}
const tip=$('#tip');
function hideTip(){tip.style.display='none'}
function posTip(e){
  if(tip.style.display!=='block')return;
  const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+16,y=e.clientY+16;
  if(x+w>innerWidth-8)x=e.clientX-w-12;if(y+h>innerHeight-8)y=e.clientY-h-12;
  tip.style.left=Math.max(4,x)+'px';tip.style.top=Math.max(4,y)+'px';
}

// =====================================================================
//  초기화 & 메인 루프
// =====================================================================
let _last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-_last)/1000)*SET.speed;_last=now;
  try{Tray.step(dt);Tray.draw(now);FX.step(dt);FX.draw(now);TitleFx.draw(now)}catch(e){console.error(e)}
  requestAnimationFrame(loop);
}
function init(){
  FX.init();
  addEventListener('resize',()=>{FX.resize();Tray.resize()});
  document.addEventListener('pointerdown',()=>SFX.unlock());
  $('#top').addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
    if(a==='bag')openBag();
    else if(a==='snd'){SET.sound=!SET.sound;saveSet();renderTop();SFX.select()}
    else if(a==='spd'){SET.speed=SET.speed>=3?1:SET.speed+1;saveSet();renderTop()}
    else if(a==='menu')openMenu();
  });
  $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
  addEventListener('error',e=>onFatal(e.error||e.message));
  addEventListener('unhandledrejection',e=>onFatal(e.reason));
  document.addEventListener('mouseover',e=>{
    const t=e.target.closest&&e.target.closest('[data-tip],[data-item]');
    if(!t||(UI.drag&&UI.drag.moved)){hideTip();return}
    tip.innerHTML=t.dataset.tip!=null?t.dataset.tip:itemTip(...t.dataset.item.split(':'));
    tip.style.display='block';posTip(e);
  });
  document.addEventListener('mousemove',posTip);
  document.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase(),a=document.activeElement;
    if($('#modal').classList.contains('show')){
      if(k==='escape')closeModal();
      else if((k==='enter'||k===' ')&&a&&a.matches&&a.matches('#modal [data-k]')){e.preventDefault();a.click()}
      return;
    }
    // 포커스된 장비 카드·맵 노드는 Enter/Space로 실행 (키보드 조작)
    if((k==='enter'||k===' ')&&a&&a.matches&&a.matches('#pcards .card[data-ci],.node.avail')){
      e.preventDefault();
      if(a.classList.contains('node'))enterNode(+a.dataset.r,+a.dataset.i);else a.click();
      return;
    }
    const C=S&&S.screen==='combat'&&S.combat;if(!C)return;
    if(k==='e'||(k==='enter'&&(!a||a===document.body))){e.preventDefault();endTurn()}
    else if(k==='escape'){UI.sel=null;UI.mode=null;render()}
    else if(k==='r'||k==='q')useSkill();
    else if(/^[1-9]$/.test(k)&&!UI.busy&&C.phase==='player'){
      const d=C.dice[+k-1];if(d)chooseDie(d.id);
    }
  });
  render();
  requestAnimationFrame(loop);
  // rAF가 멈춘 경우(비활성 탭, 가려진 창)에도 굴림 연출이 끝나 턴이 진행되도록 타이머로 대신 진행
  setInterval(()=>{
    const now=performance.now(),gap=now-_last;if(gap<300)return;_last=now;
    let t=Math.min(gap/1000,3)*SET.speed;
    try{while(t>0){const dt=Math.min(.05,t);Tray.step(dt);FX.step(dt);t-=dt}}catch(e){console.error(e)}
  },250);
}
init();
</script>
</body>
</html>
